name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  client:
    image: ${CLIENT_IMAGE:?CLIENT_IMAGE is required}
    restart: unless-stopped
    init: true
    environment:
      CLIENT_ROOT: ${CLIENT_ROOT:?CLIENT_ROOT is required}
    labels:
      one.nilx.product: 0x1
      one.nilx.client: ${CLIENT_NAME:?CLIENT_NAME is required}
      org.opencontainers.image.revision: ${RELEASE_SHA:?RELEASE_SHA is required}
    volumes:
      - ${MAP_BASEMAP_PATH:?MAP_BASEMAP_PATH is required}:/srv/map/0.1.0/basemap.pmtiles:ro
    expose:
      - "8080"
    networks:
      edge:
        aliases:
          - ${EDGE_ALIAS:?EDGE_ALIAS is required}
          - ${COMPAT_EDGE_ALIAS:?COMPAT_EDGE_ALIAS is required}
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - "-"
        - http://127.0.0.1:8080/health
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: ${EDGE_NETWORK:-nilx-edge}
    external: true
