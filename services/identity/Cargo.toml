[package]
name = "identity-bot"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"
repository = "https://github.com/nilx-one/web"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
ox1-contracts = { git = "https://github.com/nilx-one/core", rev = "240b6e79bf937261169fa98253b4d288a3d1a451" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
subtle = "2"
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
