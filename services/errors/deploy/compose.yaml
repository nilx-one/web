name: nilx-one-error-trash

services:
  error-trash:
    image: ${ERROR_TRASH_IMAGE:?ERROR_TRASH_IMAGE is required}
    restart: unless-stopped
    init: true
    env_file:
      - ${ERROR_TRASH_ENV_FILE:?ERROR_TRASH_ENV_FILE is required}
    environment:
      DATABASE_URL: sqlite:///data/error-trash.db
      HTTP_BIND: 0.0.0.0:8080
      ERROR_TRASH_RETENTION_DAYS: ${ERROR_TRASH_RETENTION_DAYS:-90}
      ERROR_TRASH_MAX_ROWS: ${ERROR_TRASH_MAX_ROWS:-1000000}
    labels:
      one.nilx.product: 0x1
      one.nilx.service: error-trash
      one.nilx.error-trash.contract: ${ERROR_TRASH_CONTRACT:?ERROR_TRASH_CONTRACT is required}
      org.opencontainers.image.revision: ${RELEASE_SHA:?RELEASE_SHA is required}
    expose:
      - "8080"
    volumes:
      - error-trash-data:/data
    networks:
      edge:
        aliases:
          - ox1-error-trash
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:8080/health
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  error-trash-data:

networks:
  edge:
    name: ${EDGE_NETWORK:-nilx-edge}
    external: true
