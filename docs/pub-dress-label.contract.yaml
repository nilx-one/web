# Implementation instruction for nilx-one/core.
#
# nilx-one/web derives a Bond's public address in its own client today
# (packages/application/src/pub-dress-url.ts) so a registering Bond can see the
# fold before committing. That derivation is a preview, not authority: the same
# rule has to exist normatively next to PubDress, or the Web client and the
# identity service can disagree about which Bond owns an address.
#
# This file is the handoff. It states what belongs in core, what is already
# decided, and the one decision that is genuinely open.

contract:
  name: pub_dress_label
  owner: nilx-one/core
  crate: ox1-contracts
  companion_of: PubDress
  consumers:
    - repository: nilx-one/web
      pinned_at: 18f8906f8ac5493577f2fa87d31d0a90e482aa9a
      uses:
        - services/identity # allocation, resolution endpoint
        - packages/application/src/pub-dress-url.ts # preview, to be replaced by the Wasm boundary
  reference: docs/pub-dress-url.md

problem:
  statement: >-
    A pub_dress is case-sensitive; a DNS label is not. The fold between them is
    not injective, so it cannot be inverted and cannot be recomputed as a view
    of the identity column.
  evidence:
    - identities.pub_dress TEXT PRIMARY KEY COLLATE BINARY
    - "identity form copy: Case-sensitive · 2–32 characters"
  collision_example:
    distinct_identities: ["0x0Sky", "0x0sky"]
    single_label: "0x0sky"
  consequences:
    - The allocated label is stored with its own uniqueness, never derived at read time.
    - A label resolves back to an identity only by lookup.
    - The first Bond to claim a label owns it; later Bonds folding onto it choose a suffix.

decided:
  # These are settled by the shape of pub_dress itself and need no debate.
  - id: slug-only-fold
    rule: Only the slug folds.
    because: The discriminator is already constrained to lowercase hexadecimal, so `0xDsky` is not a pub_dress at all.
  - id: prefix-namespacing
    rule: Every label begins with `0x` (ASCII) or `xn--` (encoded).
    because: >-
      No Bond can fold onto `www`, `api`, or `_acme-challenge`, so the Bond
      namespace is disjoint from service hosts by construction. A positive rule,
      not a reserved-name blocklist to maintain.
    note: >-
      An ASCII stem always starts `0x`, so no Bond can hand-craft a label
      beginning `xn--`. Only genuine IDNA encoding produces that prefix here,
      which means an ACE prefix can never be forged to make one Bond's label
      decode as another string.
  - id: idna-uts46
    rule: Non-ASCII is encoded with UTS-46, not refused and not transliterated.
    because: >-
      Punycode is injective and reversible, so it does not create the collision
      class this contract exists to control, and it does not exclude non-Latin
      scripts from having an address.
    parameters:
      # Pin these inside core. Do not delegate to a platform API whose UTS-46
      # revision can drift between runtimes: the mapping cannot change after
      # labels are allocated.
      unicode_version: pin explicitly, and treat a bump as a contract change
      transitional_processing: false # IDNA2008 behaviour; see deviation vectors
      use_std3_ascii_rules: true
      check_hyphens: true
      check_bidi: true
      check_joiners: true
      verify_dns_length: true
  - id: ascii-fold-only
    rule: Fold A-Z to a-z explicitly; do not call a general Unicode lowercase.
    because: >-
      A general lowercase also folds scalars this contract refuses, which hides
      a rejection behind a silent rewrite.
  - id: allocation-is-a-transaction
    rule: Resolution is advisory; the allocating insert is the only collision boundary.
    because: Matches the existing pub_dress rule in services/identity/README.md.

resolved_decision:
  id: non-ascii-mapping
  chosen: idna-uts46
  rejected:
    - id: refuse
      because: Excludes every non-Latin script from having an address at all.
    - id: transliterate
      because: Non-injective and homograph-friendly; it manufactures both collisions and phishing.
  # Every consequence below was verified against a real UTS-46 processor
  # (Python `idna` 3.11, uts46=True, transitional=False, std3_rules=True).
  # They are consequences of the choice, not open questions.
  consequences:
    - id: rtl-is-structurally-excluded
      severity: decide-and-document
      finding: >-
        No right-to-left pub_dress can have an address. RFC 5893 requires the
        first character of an RTL label to be L, R, or AL, and every label here
        begins with the digit `0` (directionality EN). `0x0א` and `0x0ء` are
        both rejected with a Bidi error.
      implication: >-
        Hebrew and Arabic Bonds are excluded by the `0x` prefix itself, not by
        anything about their script. Relaxing check_bidi is not the fix: a label
        that violates the Bidi rule will not round-trip through browsers even if
        DNS serves it.
      action: Accept and state it in the contract, or reconsider the mandatory prefix.
    - id: length-is-checked-after-encoding
      severity: correctness
      finding: >-
        A 32-scalar slug is valid for pub_dress and can still exceed 63 octets
        once encoded — a CJK slug of 32 scalars reaches 105 octets. Checking
        length before encoding would accept labels DNS cannot carry.
      action: Apply verify_dns_length to the A-label, never to the input.
    - id: deviation-characters-pin-the-flag
      severity: correctness
      finding: >-
        `0x0straße` encodes to `xn--0x0strae-wya` under non-transitional
        processing and to plain `0x0strasse` under transitional. The two
        settings allocate different addresses for the same identity.
      action: transitional_processing is false, and the vectors below lock it.
    - id: disallowed-scalars-are-not-non-ascii
      severity: api
      finding: >-
        UTS-46 rejects scalars that punycode would happily encode — `0x0🌍`
        fails on U+1F30D. The old `NonAscii` error no longer describes anything;
        a disallowed scalar is its own outcome.
      action: Replace NonAscii with DisallowedScalar and BidiRule.
    - id: confusables-remain-open
      severity: follow-up
      finding: >-
        UTS-46 does not restrict mixed scripts. `0x0paypal` and `0x0pаypal`
        (Cyrillic а) are distinct identities with distinct labels
        (`0x0paypal`, `xn--0x0pypal-46g`) — no collision, but they read alike.
        Greek final sigma and lunate sigma likewise produce distinct labels.
      action: >-
        Out of scope for this contract, which owns collision, not display.
        Consider a UTS-39 restriction level as a separate rule if Bond addresses
        are ever shown to third parties as trust signals.

api:
  language: rust
  module: ox1_contracts
  types:
    - name: PubDressLabel
      kind: newtype
      invariant: A validated, allocatable DNS label; construction is the only way to hold one.
      derives: [Clone, Debug, PartialEq, Eq, Hash]
    - name: PubDressLabelError
      kind: enum
      variants:
        - NotAPubDress # input was not canonical
        - InvalidCharacter # ASCII outside [a-z0-9-]; includes STD3 rejections such as `_`
        - DisallowedScalar # non-ASCII scalar UTS-46 marks disallowed, e.g. emoji
        - BidiRule # RFC 5893; every RTL pub_dress lands here, see consequences
        - BoundaryHyphen # leading or trailing hyphen on the composed label
        - TooLong # A-label exceeds 63 octets AFTER encoding
        - SuffixTooLong # suffix exceeds its own budget
  functions:
    - signature: "PubDressLabel::stem(pub_dress: &PubDress) -> Result<PubDressStem, PubDressLabelError>"
      returns: >-
        The A-label stem, whether folding changed the address, and the mapped
        Unicode form so a surface can show the Bond what its address means.
      note: >-
        A stem is already an A-label: `0x0Небо` yields `xn--0x0-dddt1cj`, not a
        Unicode string awaiting encoding elsewhere.
    - signature: "PubDressLabel::compose(stem: &PubDressStem, suffix: &str) -> Result<PubDressLabel, PubDressLabelError>"
      note: >-
        Compose on the mapped Unicode form and encode once, then validate the
        resulting A-label. Appending a suffix to an already-encoded `xn--` label
        would produce a string that no longer decodes.
      suffix_charset: >-
        ASCII lowercase and digits, whatever the stem's script. The suffix is a
        disambiguator, not part of the chosen name, and keeping it ASCII means
        it can never change how the stem encodes.
    - signature: "PubDressLabel::parse(label: &str) -> Result<PubDressLabel, PubDressLabelError>"
      note: For the resolution endpoint, which receives a label rather than a pub_dress.
    - signature: "PubDressLabel::as_str(&self) -> &str"
  constants:
    label_max_octets: 63 # RFC 1035, measured on the A-label
    suffix_max_length: 8
    zone_is_not_owned_here: true # the zone is deployment configuration, not protocol

test_vectors:
  # ASCII rows mirror packages/application/src/pub-dress-url.test.ts. Encoded
  # rows were computed with Python `idna` 3.11 under the pinned parameters
  # (uts46=True, transitional=False, std3_rules=True) — they are measured, not
  # illustrative. Every row should exist as a Rust test.
  stem_ascii:
    - input: "0xda-sha"
      label: "0xda-sha"
      folded: false
    - input: "0xdA-Sha"
      label: "0xda-sha"
      folded: true
    - input: "0x0Sky"
      label: "0x0sky"
      folded: true
    - input: "0x0sky"
      label: "0x0sky"
      folded: false
      note: Together with the row above, the collision this contract exists to control.
    - input: "sky"
      error: NotAPubDress
    - input: "0xgsky"
      error: NotAPubDress
      note: Non-hexadecimal discriminator.
    - input: "0xDsky"
      error: NotAPubDress
      note: An uppercase discriminator is not a pub_dress; the fold never reaches it.
    - input: "0x0sky_one"
      error: InvalidCharacter
      note: U+005F is disallowed_STD3_valid, so use_std3_ascii_rules decides this row.
    - input: "0x0sky-"
      error: BoundaryHyphen

  stem_encoded:
    - input: "0x0небо"
      label: "xn--0x0-dddt1cj"
      octets: 15
      folded: false
    - input: "0x0Небо"
      label: "xn--0x0-dddt1cj"
      octets: 15
      folded: true
      note: >-
        The case fold survives encoding — two case-distinct Cyrillic identities
        land on one label, exactly as two ASCII ones do.
    - input: "0xdпривіт"
      label: "xn--0xd-hdd3a5bhs3p"
      octets: 19
    - input: "0x0café"
      label: "xn--0x0caf-gva"
      octets: 14
    - input: "0x0日本"
      label: "xn--0x0-v08fl0d"
      octets: 15

  deviation_characters:
    # These rows exist only to pin transitional_processing: false. Under
    # transitional processing they produce different addresses for the same
    # identity, which is unrecoverable once labels are allocated.
    - input: "0x0straße"
      label: "xn--0x0strae-wya"
      octets: 16
      under_transitional: "0x0strasse"
    - input: "0x0ςigma"
      label: "xn--0x0igma-zpf"
      octets: 15
      under_transitional: "xn--0x0igma-7pf"
      note: Final sigma is preserved, not folded to σ.

  rejections_encoded:
    - input: "0x0🌍"
      error: DisallowedScalar
      detail: U+1F30D is disallowed by UTS-46 even though punycode would encode it.
    - input: "0x0א"
      error: BidiRule
      detail: >-
        RFC 5893 requires an RTL label to begin with L, R, or AL; this label
        begins with the digit `0`.
    - input: "0x0ء"
      error: BidiRule
      detail: Same cause. Every Hebrew and Arabic pub_dress lands here.
    - input: "0x0一凥嗊妯嶔慹敞楃洨焍瓲磗粼傡咆填屐怵搚柿毤濉玮瞓筸佝卂圧嬌廱拖暻"
      error: TooLong
      detail: >-
        32 scalars — a valid pub_dress slug — encoding to 105 octets. This row
        is the reason length is measured on the A-label.

  compose:
    - stem: "0xda-sha"
      suffix: ""
      label: "0xda-sha"
    - stem: "0xda-sha"
      suffix: "7412"
      label: "0xda-sha7412"
    - stem: "0x0sky"
      suffix: "TWO"
      label: "0x0skytwo"
      note: The suffix folds the same way the stem does.
    - stem_input: "0x0небо"
      suffix: "7412"
      label: "xn--0x07412-dgg9a9en"
      octets: 20
      note: >-
        Composed on the mapped Unicode form and encoded once. Appending the
        suffix to `xn--0x0-dddt1cj` instead would produce a label that no longer
        decodes.
    - stem: "0x0sky"
      suffix: "2-"
      error: BoundaryHyphen
    - stem: "0x0sky"
      suffix: "a.b"
      error: InvalidCharacter
    - stem: "0x0sky"
      suffix: "111111111"
      error: SuffixTooLong

  properties:
    - Every label begins with "0x" or "xn--".
    - No ASCII stem can begin with "xn--", so an ACE prefix cannot be forged.
    - Encoding is injective; only case and NFC differences collapse.
    - Any suffix of decimal digits composes into a valid label when the stem is valid.
    - verify_dns_length is applied to the A-label, never to the input.

downstream:
  # Work in nilx-one/web that unblocks once the contract lands. Listed so the
  # core change is sized against what it has to serve.
  - repository: nilx-one/web
    steps:
      - id: pin
        action: Move the ox1-contracts rev in services/identity/Cargo.toml to the commit adding this contract.
      - id: migration
        action: Add migration 0005 storing the allocated label.
        detail: >-
          UNIQUE and COLLATE NOCASE on the label column. The identity it belongs
          to is the existing pub_dress foreign key.
      - id: allocation
        action: Allocate the label inside the existing registration transaction.
        detail: >-
          Bounded retry (8 attempts) on suffix collision, then a plain error.
          Never a loop without a bound, never a check-then-insert.
      - id: endpoint
        action: "POST /api/v1/identity/url/resolve"
        request: '{"label": "0xda-sha"}'
        responses:
          - '{"state": "available", "label": "0xda-sha"}'
          - '{"state": "registered", "label": "0xda-sha"}'
          - "error code invalid_pub_dress_label"
          - "error code rate_limited"
        note: >-
          The client adapter already speaks this shape
          (packages/identity-http/src/index.ts).
      - id: projection
        action: Add pub_dress_url to the identity projection.
        note: The client already parses it and treats it as optional.
      - id: client-preview
        action: >-
          Route the Web client's preview through the shared Core boundary
          instead of packages/application/src/pub-dress-url.ts.
        detail: >-
          The preview now encodes non-ASCII through the platform's own UTS-46,
          reached by URL parsing, so a Cyrillic Bond sees its address rather
          than a deferral. That is a conformant implementation but not the
          pinned one, so it stays a preview until Core owns the encoding.
        verified_agreement: >-
          The platform encoder matches this contract's vectors exactly on every
          valid row, including the non-transitional readings of ß and ς.
        known_divergence: >-
          URL parsing relaxes UseSTD3ASCIIRules and CheckHyphens, so it accepts
          `_`, a trailing hyphen, and emoji. The client applies its own charset,
          boundary and length rules around the encoder rather than trusting it,
          and uses a letter/mark/digit test as a conservative stand-in for the
          UTS-46 validity table: it may refuse a scalar Core accepts, never the
          reverse.
      - id: contract-version
        action: Bump services/identity/deploy/contract.version and requiresIdentityContract in deploy/web/targets.json.
        note: Only once a verified identity package providing the new contract exists in the release ancestry.

out_of_scope:
  - id: zone-routing
    detail: Wildcard DNS and TLS for the zone.
    owner: 0x0sky/infra
    reference: deploy/web/README.md — "0x0sky/infra owns public HTTPS route selection"
  - id: certificate-shape
    detail: >-
      One wildcard certificate over ACME DNS-01. Per-label certificates would
      publish every registered nickname in Certificate Transparency logs
      permanently.
  - id: cookie-boundary
    detail: >-
      Already correct and must stay correct: session and remembered-Bond cookies
      use the __Host- prefix and set no Domain attribute, so no subdomain can
      read or shadow them (services/identity/src/api.rs).
    escalation: >-
      If Bond addresses ever serve Bond-controlled JavaScript, __Host- alone
      stops being sufficient and they need their own registrable domain plus a
      Public Suffix List entry.

acceptance:
  - The contract compiles in ox1-contracts with no dependency on a zone, a database, or a transport.
  - Every row in test_vectors exists as a test and passes.
  - >-
    The pinned Unicode version and the seven UTS-46 parameters are asserted in a
    test, not only configured. The deviation rows fail loudly if
    transitional_processing is ever flipped.
  - >-
    The RTL exclusion is stated in the contract's own documentation. A Bond
    whose pub_dress cannot have an address must learn that from the product, not
    from an empty field.
  - >-
    The Web client's preview derivation is replaced by, or verified against,
    this contract rather than living beside it indefinitely. Its vectors already
    assert the same encoded values, so a divergence between Core and the
    platform encoder fails the Web suite rather than reaching a Bond.
