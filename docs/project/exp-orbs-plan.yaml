document:
  id: exp-orbs-plan
  version: 1.2.0
  status: decided_not_implemented
  language: en
  created_at: 2026-10-21
  project: 0x1
  repository: nilx-one/web
  purpose: >-
    Record everything decided about Experience Orbs and the documented-but-
    absent features found next to them, so the delivery chain across
    nilx-one/core, services/identity and Web follows one written decision.
  reference: docs/exp-orbs.md

baseline:
  web_master_sha: 510448ee85a5eb81cfd79a02c72aea0bc756e4f4
  pinned_core_revision: e99abfdce62f240da1a869a7b48a7f89c7249967
  deployed:
    # Read from https://nilx.one/core/0.1.0/provenance.json on 2026-10-21.
    core_revision: e99abfdce62f240da1a869a7b48a7f89c7249967
    orb_spill_version: 2
  live_behaviour:
    spill_owner: find
    trigger: any reveal (Avaia, Bond on foot, approach)
    count: 5..30 per find, orb_count(artifact_id)
    pays: 10 per orb, ORB_EXPERIENCE, to whoever picks it up
    claim: first wins, identity service

decisions:
  - id: exp-orbs-per-avaia-cell
    status: decided
    decided_by: 0x0sky
    decided_at: 2026-10-21
    rule:
      spills_from: every fog cell that opens for the Bond
      openers: [avaia, bond_standing_in_it, bond_approaching_within_15m]
      when: once, as the cell opens for that Bond
      count: 5 + 5 * landmarks_in_cell
      cap: none
      placement:
        cell: 5 scattered around the cell centre
        landmark: 5 around each landmark
      pickers: [bond, avaia]
      reach: within 15 m of the orb (ORB_PICKUP_METERS, inclusive)
      pick_up_feel: drawn to the picker, with a sound and a light haptic tap where the host has one
      earner: whoever picks the orb up
      orb_experience: unchanged (10)
      visibility: the Bond's own; never seen by, shared with or claimed against another Bond
    consequences:
      - a cell without a find still spills 5 orbs
      - finds keep their own roll, sighting and pick-up rules; an orb never claims a find
      - the spill identity moves from artifact_id to the Bond and the cell
      - no stored spill on the service, no first-wins between Bonds, no taken
      - between the Bond and its Avaia, whoever reaches an orb first picks it up
  - id: pamiatka-is-landmark
    status: decided
    decided_by: 0x0sky
    decided_at: 2026-10-21
    rule: >-
      A Pamiatka is an Avaia landmark (docs/avaia-osm-landmarks.md), read from
      the published archive and deduplicated by the same rules. Ordinary
      shops, cafes and buildings are not landmarks.
    current_kinds_source: packages/map-maplibre/src/landmark-kinds.json
    purpose: the landmark's orbs bring the Bond or its Avaia close enough to describe it
  - id: service-counts-and-keeps-nothing
    status: decided
    decided_by: 0x0sky
    decided_at: 2026-10-21
    supersedes: cell-state-is-the-bonds-own
    answers: landmark-count-authority
    rule: >-
      The device sends the opened cell to the identity service; the service
      counts its landmarks through Core over the published archive and
      answers the spill. It stores nothing about the request: not the cell,
      its landmarks or its count. Another Bond never sees the spill.
    orb_id: >-
      A keyed digest of the Bond, the cell and the orb's index, recomputable
      by the service, so a pick-up is checked without a stored spill and the
      same cell always answers the same orbs.
  - id: experience-has-no-weekly-cap
    status: decided
    decided_by: 0x0sky
    decided_at: 2026-10-21
    rule: >-
      Experience is not money. orb_picked_up has no weekly cap; an orb id
      pays once, deduplicated by the Bond's own award chain.
  - id: every-opening-spills
    status: decided
    decided_by: 0x0sky
    decided_at: 2026-10-21
    answers: bond-opened-cells
    rule: >-
      The ground opened for both of them, so every opening spills: the
      Avaia's, the Bond standing in the cell, and the Bond approaching within
      15 m of it. A cell still spills once.

open_questions: []

delivery:
  # One pull request per step, in order. Each step waits for the previous
  # one to merge; Web never ships a rule Core has not.
  - step: 1
    repository: nilx-one/web
    kind: docs
    scope: >-
      docs/exp-orbs.md and this plan (#536), then the answered questions
      recorded here.
    status: merged_then_amended
  - step: 2
    repository: nilx-one/core
    kind: contract
    scope: >-
      Versioned per-cell spill in orb_world: 5 + 5 × landmarks, no cap, orb
      ids, placement around the centre and each landmark, pick-up between the
      Bond and its Avaia, exported through Wasm and UniFFI, with the per-find
      v1/v2 wire still accepted. Fixtures through native, Wasm and UniFFI.
    scope_added: >-
      The landmark rules over the archive move into Core, so the service and
      the device count alike; spill input is the Bond and the cell; orb ids
      are keyed digests; reach is inclusive at 15 m.
    status: pending
  - step: 3
    repository: nilx-one/web
    kind: service
    scope: >-
      services/identity answers a cell's spill through Core over the
      published archive without storing it, and prices orb_picked_up for
      either earner by its orb id, once, without a weekly cap; the per-find
      spill endpoints stay for older hosts until step 4 ships, then retire.
      Bumps services/identity/deploy/contract.version.
    depends_on: 2
    status: pending
  - step: 4
    repository: nilx-one/web
    kind: client
    scope: >-
      Pin the new Core runtime; on every reveal (avaia, approach, nearby) ask
      the service for the cell's spill and draw it; pull an orb in reach to
      its picker with a sound and a light haptic tap (Telegram haptic
      feedback, Vibration API where present, sound only on iPhone Safari).
    depends_on: 3
    acceptance:
      - an opened cell without a find shows 5 orbs around its centre, whoever opened it
      - a cell with n landmarks shows 5 + 5n, 5 around each landmark
      - another Bond in the same cell sees none of them
      - Bond and Avaia each earn their own pick-ups; an orb one picked is gone for the other
      - the service stores nothing about the cell, its landmarks or its count
      - an orb within 15 m is drawn in with a sound and, where the host has one, a haptic tap
      - real iPhone Safari and Telegram Mini App inspection
    status: pending

