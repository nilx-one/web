# Temporary, PR-scoped lockfile generation; remove before merge.
name: Temporary MapLibre lockfile regeneration
on:
  push:
    branches: [fix/maplibre-6-18-upgrade]
    paths: [packages/map-shade/package.json]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate with repository pnpm version
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Verify lockfile correctness
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
      - name: Export generated lockfile in log
        shell: bash
        run: |
          echo 'LOCKFILE_BASE64_START'
          base64 --wrap=4000 pnpm-lock.yaml
          echo 'LOCKFILE_BASE64_END'
