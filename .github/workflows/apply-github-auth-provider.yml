name: Apply GitHub auth provider transformation

on:
  push:
    branches:
      - feature/github-auth-provider
    paths:
      - scripts/apply-github-auth-provider.py
      - .github/workflows/apply-github-auth-provider.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/github-auth-provider
      - name: Apply source transformation
        run: python3 scripts/apply-github-auth-provider.py
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Remove temporary transformation machinery
        run: |
          rm -f scripts/apply-github-auth-provider.py
          rm -f .github/workflows/apply-github-auth-provider.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add GitHub browser authentication provider"
          git push origin HEAD:feature/github-auth-provider
