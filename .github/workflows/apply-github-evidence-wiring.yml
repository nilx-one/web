name: Apply GitHub evidence invariants

on:
  push:
    branches:
      - feature/github-evidence-connection
    paths:
      - .github/workflows/apply-github-evidence-wiring.yml
      - .github/scripts/enforce-github-evidence-invariants.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/github-evidence-connection
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply invariants
        run: python .github/scripts/enforce-github-evidence-invariants.py
      - name: Validate identity capability
        run: |
          cargo fmt --manifest-path services/identity/Cargo.toml --all
          cargo test --manifest-path services/identity/Cargo.toml
          cargo clippy --manifest-path services/identity/Cargo.toml --all-targets -- -D warnings
          sh services/identity/deploy/prepare-runtime-env.test.sh
          git diff --check
      - name: Commit verified invariant changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/identity/src/provider_link.rs services/identity/src/main.rs \
            services/identity/deploy/prepare-runtime-env.sh \
            services/identity/deploy/prepare-runtime-env.test.sh
          git commit -m "fix: keep GitHub auth and evidence identities aligned"
          git push origin HEAD:feature/github-evidence-connection
