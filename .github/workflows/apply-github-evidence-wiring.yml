name: Render GitHub evidence deploy workflow

on:
  push:
    branches:
      - feature/github-evidence-connection
    paths:
      - .github/workflows/apply-github-evidence-wiring.yml
      - .github/scripts/render-github-evidence-deploy-workflow.py

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/github-evidence-connection
      - name: Render deployment workflow
        run: python .github/scripts/render-github-evidence-deploy-workflow.py
      - name: Validate generated deployment contract
        run: |
          grep -F 'GITHUB_EVIDENCE_CLIENT_ID: ${{ vars.GITHUB_EVIDENCE_CLIENT_ID }}' .github/deploy-identity-service.generated.txt
          grep -F 'GITHUB_EVIDENCE_CLIENT_SECRET: ${{ secrets.GITHUB_EVIDENCE_CLIENT_SECRET }}' .github/deploy-identity-service.generated.txt
          grep -F 'GitHub browser authentication and evidence access must use different OAuth clients' .github/deploy-identity-service.generated.txt
          grep -F "printf 'GITHUB_EVIDENCE_CLIENT_ID=%s\\n'" .github/deploy-identity-service.generated.txt
      - name: Commit generated workflow text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/deploy-identity-service.generated.txt
          git commit -m "chore: stage GitHub evidence deploy workflow"
          git push origin HEAD:feature/github-evidence-connection
