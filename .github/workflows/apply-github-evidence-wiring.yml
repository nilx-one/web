name: Apply GitHub evidence runtime wiring

on:
  push:
    branches:
      - feature/github-evidence-connection
    paths:
      - .github/workflows/apply-github-evidence-wiring.yml
      - .github/scripts/apply-github-evidence-wiring.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/github-evidence-connection
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Apply source transform
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply-github-evidence-wiring.py')
          text = path.read_text().replace(
              'if text.count(old) != 1:',
              'if text.count(old) < 1:',
              1,
          )
          text = text.replace(
              "needle = '''{\n  printf '%s\\n' 'TELOXIDE_TOKEN=attempted-override'",
              "needle = r'''{\n  printf '%s\\n' 'TELOXIDE_TOKEN=attempted-override'",
              1,
          )
          text = text.replace(
              "    '''{\n  printf '%s\\n' 'TELOXIDE_TOKEN=attempted-evidence-key-override'",
              "    r'''{\n  printf '%s\\n' 'TELOXIDE_TOKEN=attempted-evidence-key-override'",
              1,
          )
          text = text.replace(
              "old = '''          if [ -n \"$GITHUB_AUTH_CLIENT_ID\" ] && [ -n \"$GITHUB_AUTH_CLIENT_SECRET\" ]; then",
              "old = r'''          if [ -n \"$GITHUB_AUTH_CLIENT_ID\" ] && [ -n \"$GITHUB_AUTH_CLIENT_SECRET\" ]; then",
              1,
          )
          text = text.replace(
              "    + '''          if [ -n \"$GITHUB_EVIDENCE_CLIENT_ID\" ] && [ -n \"$GITHUB_EVIDENCE_CLIENT_SECRET\" ]; then",
              "    + r'''          if [ -n \"$GITHUB_EVIDENCE_CLIENT_ID\" ] && [ -n \"$GITHUB_EVIDENCE_CLIENT_SECRET\" ]; then",
              1,
          )
          path.write_text(text)
          PY
          python .github/scripts/apply-github-evidence-wiring.py
          python - <<'PY'
          from pathlib import Path
          path = Path('services/identity/src/github_evidence.rs')
          text = path.read_text()
          old = '.signer\n        .verify(&cookie)\n        .filter(|transaction| transaction.expires_at > now)'
          new = '.signer\n        .verify::<EvidenceTransaction>(&cookie)\n        .filter(|transaction| transaction.expires_at > now)'
          if text.count(old) != 1:
              raise SystemExit('expected evidence transaction verification site')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate identity capability
        run: |
          cargo fmt --manifest-path services/identity/Cargo.toml --all
          cargo test --manifest-path services/identity/Cargo.toml
          cargo clippy --manifest-path services/identity/Cargo.toml --all-targets -- -D warnings
          sh services/identity/deploy/prepare-runtime-env.test.sh
          git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/identity/Cargo.toml services/identity/Cargo.lock \
            services/identity/src/github_evidence.rs services/identity/src/main.rs \
            services/identity/deploy/prepare-runtime-env.sh \
            services/identity/deploy/prepare-runtime-env.test.sh \
            services/identity/deploy/env.example .github/workflows/deploy-identity-service.yml
          git commit -m "feat: wire GitHub evidence capability into identity runtime"
          git push origin HEAD:feature/github-evidence-connection
