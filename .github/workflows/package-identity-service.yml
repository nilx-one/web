name: Package Identity Service

on:
  push:
    # Every master head: infra delivers only the image tagged with exactly the
    # branch head, so a head that only touched the clients needs one too.
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-identity-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nilx-one/0x1-identity

jobs:
  package:
    name: Package immutable image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - id: contract
        name: Resolve identity contract version
        run: |
          set -Eeuo pipefail
          value="$(tr -d '[:space:]' < services/identity/deploy/contract.version)"
          [[ "$value" =~ ^[0-9]+$ ]]
          echo "value=$value" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable runtime
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity/Dockerfile
          push: true
          # `<full SHA>` is the tag infra's automatic delivery resolves
          # (aiaiaiai-org/infra docs/automatic-delivery.md); `sha-` stays for
          # the legacy identity dependency workflow.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            one.nilx.identity.contract=${{ steps.contract.outputs.value }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest the commit image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # The 0x1 API's secret envelope for infra's automatic delivery of
  # nilxone-identity. It runs only once the owner set the repository variable
  # API_DELIVERY=enabled after filling the production Environment, so master
  # never depends on production secrets before then. This repository holds no
  # infra credential; infra holds none of these values.
  envelope:
    name: Publish the production secret envelope
    needs: package
    if: github.ref == 'refs/heads/master' && vars.API_DELIVERY == 'enabled'
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Seal the 0x1 API credentials to the edge-prod-1 recipient
        env:
          # NATIVE_AUTH_SECRET, PASSWORD_PEPPER and GITHUB_EVIDENCE_ENCRYPTION_KEY are
          # not here on purpose: the production host owns them. prepare-runtime-env.sh
          # keeps its existing values and refuses an override, and infra's contract
          # refuses them in an envelope. A copy in GitHub could lock out every password,
          # end every session and lose every stored GitHub token.
          TELOXIDE_TOKEN: ${{ secrets.TELOXIDE_TOKEN }}
          TELEGRAM_OIDC_CLIENT_SECRET: ${{ secrets.TELEGRAM_OIDC_CLIENT_SECRET }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          NILX_BROWSER_HANDOFF_TOKEN: ${{ secrets.NILX_BROWSER_HANDOFF_TOKEN }}
          TELEGRAM_OIDC_CLIENT_ID: ${{ vars.TELEGRAM_OIDC_CLIENT_ID }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: |
          set -Eeuo pipefail
          umask 077
          names=(TELOXIDE_TOKEN TELEGRAM_OIDC_CLIENT_ID TELEGRAM_OIDC_CLIENT_SECRET
                 DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET NILX_BROWSER_HANDOFF_TOKEN)
          for name in "${names[@]}"; do
            value="$(printenv "$name")"
            test -n "$value" || { echo "::error::Missing production value $name." >&2; exit 1; }
            [[ "$value" != *$'\n'* && "$value" != *$'\r'* ]] || { echo "::error::Invalid multiline value for $name." >&2; exit 1; }
          done
          (( $(printf %s "$NILX_BROWSER_HANDOFF_TOKEN" | wc -c) >= 32 )) || { echo "::error::NILX_BROWSER_HANDOFF_TOKEN must contain at least 32 bytes." >&2; exit 1; }
          # The envelope carries exactly the names nilxone-identity's contract lists under
          # delivery.envelope (aiaiaiai-org/infra docs/automatic-delivery.md).
          contract="$(curl -fsSL https://raw.githubusercontent.com/aiaiaiai-org/infra/master/contracts/services/nilxone-identity.yaml)"
          mapped="$(awk '/^    envelope:/ { in_list = 1; next } in_list && /^      - [A-Z][A-Z0-9_]*$/ { sub(/^      - /, ""); print; next } in_list { exit }' <<<"$contract" | sort)"
          test -n "$mapped" || { echo "::error::nilxone-identity lists no delivery.envelope in infra." >&2; exit 1; }
          test "$mapped" = "$(printf '%s\n' "${names[@]}" | sort)" || {
            echo "::error::nilxone-identity lists different envelope names than this job carries." >&2
            exit 1
          }
          server="$(curl -fsSL https://raw.githubusercontent.com/aiaiaiai-org/infra/master/contracts/servers/edge-prod-1.yaml)"
          recipient="$(sed -n 's/^  encryptionRecipient: //p' <<<"$server")"
          [[ "$recipient" =~ ^ssh-ed25519\ [A-Za-z0-9+/]{68}$ ]] || { echo "::error::edge-prod-1 publishes no valid encryptionRecipient." >&2; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          mkdir -p "$RUNNER_TEMP/envelope"
          for name in "${names[@]}"; do printf '%s=%s\n' "$name" "$(printenv "$name")"; done |
            age --recipient "$recipient" --output "$RUNNER_TEMP/envelope/secrets.age"
          test -s "$RUNNER_TEMP/envelope/secrets.age"
          printf 'FROM scratch\nCOPY secrets.age /secrets.age\n' > "$RUNNER_TEMP/envelope/Dockerfile"
          echo "ENVELOPE_CONTEXT=$RUNNER_TEMP/envelope" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the secret envelope
        id: envelope
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ENVELOPE_CONTEXT }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}.secrets
      - name: Attest the secret envelope
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.envelope.outputs.digest }}
          push-to-registry: true
