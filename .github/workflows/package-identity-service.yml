name: Package Identity Service

on:
  push:
    branches: [master]
    paths:
      - "services/identity/**"
      - ".github/workflows/package-identity-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-identity-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nilx-one/0x1-identity

jobs:
  package:
    name: Package immutable image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
