name: Package Clients

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-clients-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nilx-one/0x1-web

jobs:
  package:
    name: Package immutable client image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Checkout pinned Core runtime source
        uses: actions/checkout@v4
        with:
          repository: nilx-one/core
          ref: e09a42184951b6f40ad4b11eedf6e48c5b6a0ac9
          path: .core-source
          persist-credentials: false
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Prepare verified Core Wasm runtime
        run: |
          ./scripts/prepare_core_wasm_runtime.sh .core-source
          rm -rf .core-source
      - name: Build production Web hosts
        run: pnpm --filter @nilx-one/site --filter @nilx-one/telegram-mini-app --filter @nilx-one/discord-activity build
      - name: Validate client target manifest
        run: |
          jq -e '
            .schema == 1
            and (.deployOrder | type == "array" and length > 0)
            and ([.deployOrder[] as $name | .targets[$name] != null] | all)
          ' deploy/web/targets.json >/dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable client runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
