name: Package Clients

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-clients-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nilx-one/0x1-web
  VITE_ERRORS_COLLECTOR_ENDPOINT: https://errors.aiaiaiai.org

jobs:
  package:
    name: Package immutable client image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - id: core-runtime-cache
        name: Restore pinned Core Wasm runtime
        uses: actions/cache@v4
        with:
          path: |
            apps/site/public/core/0.1.0
            apps/telegram-mini-app/public/core/0.1.0
            apps/discord-activity/public/core/0.1.0
          key: core-wasm-v1-${{ runner.os }}-c224304947280169017e298237bcf5361d1bfb30-wbg-0.2.127-${{ hashFiles('scripts/prepare_core_wasm_runtime.sh') }}
      - name: Checkout pinned Core runtime source
        if: steps.core-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: nilx-one/core
          ref: c224304947280169017e298237bcf5361d1bfb30
          path: .core-source
          persist-credentials: false
      - name: Install matching wasm-bindgen CLI
        if: steps.core-runtime-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Prepare verified Core Wasm runtime
        if: steps.core-runtime-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/prepare_core_wasm_runtime.sh .core-source
          rm -rf .core-source
      - name: Verify pinned Core Wasm runtime
        run: |
          set -Eeuo pipefail
          expected_core=c224304947280169017e298237bcf5361d1bfb30
          expected_wasm=173c3e9164c030384865013df87d36a29846b09cd2b8ee59b433509b2d77c90d
          for host in site telegram-mini-app discord-activity; do
            runtime="apps/$host/public/core/0.1.0"
            test -f "$runtime/index.js"
            test -f "$runtime/index_bg.wasm"
            test -f "$runtime/provenance.json"
            printf '%s  %s\n' "$expected_wasm" "$runtime/index_bg.wasm" | sha256sum --check --status
            jq -e --arg core "$expected_core" --arg digest "$expected_wasm" '
              .core_repository == "nilx-one/core"
              and .core_revision == $core
              and .contract_version == "0.1.0"
              and .wasm_sha256 == $digest
            ' "$runtime/provenance.json" >/dev/null
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/avatars/requirements.txt
      - id: avatar-cache
        name: Restore deterministic avatar assets
        uses: actions/cache@v4
        with:
          path: deploy/web/avatars
          key: avatar-assets-v1-${{ runner.os }}-py312-${{ hashFiles('tools/avatars/**') }}
      - name: Install avatar dependencies
        run: python -m pip install -r tools/avatars/requirements.txt
      - name: Generate versioned avatar assets
        if: steps.avatar-cache.outputs.cache-hit != 'true'
        run: sh tools/avatars/build.sh
      - name: Verify versioned avatar assets
        run: sha256sum --check tools/avatars/SHA256SUMS
      - name: Build production Web hosts
        run: pnpm --filter @nilx-one/site --filter @nilx-one/telegram-mini-app --filter @nilx-one/discord-activity build
      - name: Verify browser error collector configuration
        run: grep -R --fixed-strings "$VITE_ERRORS_COLLECTOR_ENDPOINT" apps/site/dist/assets >/dev/null
      - name: Validate client target manifest
        run: |
          jq -e '
            .schema == 1
            and (.deployOrder | type == "array" and length > 0)
            and ([.deployOrder[] as $name | .targets[$name] != null] | all)
          ' deploy/web/targets.json >/dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable client runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
