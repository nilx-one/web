name: Deploy Client Host

on:
  workflow_call:
    inputs:
      target:
        description: Client host target declared in deploy/web/targets.json
        required: true
        type: string
      release_sha:
        description: Commit whose immutable client package is activated
        required: true
        type: string
    secrets:
      INFRA_DEPLOY_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Request infra activation for ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      CLIENT_NAME: ${{ inputs.target }}
      IMAGE_REPOSITORY: ghcr.io/nilx-one/0x1-web
      INFRA_REPOSITORY: aiaiaiai-org/infra
      INFRA_DEPLOY_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}

      - name: Resolve client target contract
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CLIENT_NAME" =~ ^[a-z0-9-]+$ ]]
          test -n "$INFRA_DEPLOY_TOKEN"

          jq -e --arg target "$CLIENT_NAME" '.targets[$target]' deploy/web/targets.json >/dev/null
          workload=""
          case "$CLIENT_NAME" in
            web) workload="nilxone-web" ;;
            telegram) workload="nilxone-telegram" ;;
            discord) workload="nilxone-discord" ;;
            *) echo "Unsupported deployment target: $CLIENT_NAME" >&2; exit 1 ;;
          esac
          echo "WORKLOAD=$workload" >>"$GITHUB_ENV"
          echo "CLIENT_IMAGE=$IMAGE_REPOSITORY:sha-$RELEASE_SHA" >>"$GITHUB_ENV"

      - name: Wait for immutable client package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          package_ready=false

          for attempt in $(seq 1 40); do
            response="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/package-web.yml/runs" \
              -f per_page=100)"

            package_state="$(jq -r --arg sha "$RELEASE_SHA" '
              .workflow_runs
              | map(select(.head_sha == $sha))
              | first
              | if . == null then "" else [.status, (.conclusion // ""), .html_url] | @tsv end
            ' <<<"$response")"

            if [ -z "$package_state" ]; then
              echo "Package Clients run for $RELEASE_SHA is not registered yet (attempt $attempt/40)."
              sleep 10
              continue
            fi

            IFS=$'	' read -r package_status package_conclusion package_url <<<"$package_state"
            if [ "$package_status" = completed ]; then
              if [ "$package_conclusion" != success ]; then
                echo "Package Clients did not succeed for $RELEASE_SHA: $package_conclusion" >&2
                echo "$package_url" >&2
                exit 1
              fi
              package_ready=true
              break
            fi

            echo "Package Clients is $package_status for $RELEASE_SHA (attempt $attempt/40)."
            sleep 10
          done

          if [ "$package_ready" != true ]; then
            echo "Timed out waiting for Package Clients to finish for $RELEASE_SHA." >&2
            exit 1
          fi

      - name: Validate infra deployment credential
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          if ! gh api --method GET "repos/${INFRA_REPOSITORY}/actions/workflows/deploy-workload.yml" >/dev/null; then
            echo "::error::INFRA_DEPLOY_TOKEN cannot read Actions workflows in ${INFRA_REPOSITORY}. Grant the token Actions: Read access to the infra repository." >&2
            exit 1
          fi

      - id: dispatch
        name: Request infra workload deployment
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          baseline="$(bash deploy/infra-workload.sh latest-run-id)"
          echo "baseline_run_id=$baseline" >>"$GITHUB_OUTPUT"

          jq -n \
            --arg workload "$WORKLOAD" \
            --arg image "$CLIENT_IMAGE" \
            --arg source "$GITHUB_REPOSITORY" \
            --arg ref "$RELEASE_SHA" \
            '{
              event_type: "deploy-workload",
              client_payload: {
                workload: $workload,
                image: $image,
                source_repository: $source,
                ref: $ref
              }
            }' |
            gh api --method POST "repos/${INFRA_REPOSITORY}/dispatches" --input -

      - name: Wait for infra deployment
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          BASELINE_RUN_ID: ${{ steps.dispatch.outputs.baseline_run_id }}
        run: bash deploy/infra-workload.sh await "$WORKLOAD" "$CLIENT_IMAGE" "$BASELINE_RUN_ID"

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### 0x1 client deployment"
            echo
            echo "- target: \`$CLIENT_NAME\`"
            echo "- workload: \`${WORKLOAD:-unknown}\`"
            echo "- image: \`${CLIENT_IMAGE:-unknown}\`"
            echo "- result: \`${{ job.status }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
