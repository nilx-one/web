name: Identity Service CI

on:
  pull_request:
    paths:
      - "services/identity/**"
      - "packages/application/**"
      - "packages/identity-http/**"
      - "packages/product-app/**"
      - "deploy/web/targets.json"
      - ".github/workflows/identity-service.yml"

permissions:
  contents: write

jobs:
  apply-final-fix:
    if: github.head_ref == 'feature/browser-provider-auth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply final browser auth integration
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("services/identity/src/browser_web_auth.rs")
          text = path.read_text()
          old = '''    let transaction = match callback_transaction(&state, &headers, &query, BrowserProvider::Discord)
          {
              Ok(value) => value,
              Err(response) => return response,
          };
'''
          if old not in text:
              old = '''    let transaction = match callback_transaction(&state, &headers, &query, BrowserProvider::Discord)
    {
        Ok(value) => value,
        Err(response) => return response,
    };
'''
          new = '''    let transaction = match callback_transaction(&state, &headers, &query, BrowserProvider::Discord)
    {
        Ok(value) => value,
            Err(response) => return response,
    };
'''
          if text.count(old) != 1:
              raise SystemExit("expected one Discord callback block")
          path.write_text(text.replace(old, new, 1))
          PY
          python3 .github/scripts/finalize-browser-auth.py
          cargo fmt --manifest-path services/identity/Cargo.toml --all
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/identity/src/browser_web_auth.rs \
            services/identity/deploy/contract.version \
            deploy/web/targets.json \
            packages/product-app/src/index.tsx \
            packages/product-app/src/features/identity/identity-foundation-view.tsx
          git commit -m "fix(auth): complete browser provider integration"
          git push origin HEAD:${GITHUB_HEAD_REF}
