name: Identity Service CI

on:
  pull_request:
    paths:
      - "services/identity/**"
      - ".github/workflows/identity-service.yml"

permissions:
  contents: write

jobs:
  apply-clippy-fixes:
    name: Apply Clippy fixes to PR branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply source fixes
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          api_path = Path("services/identity/src/api.rs")
          api = api_path.read_text()

          old_hint = '''    if let Some(hint) = read_cookie(&headers, REMEMBERED_BOND_COOKIE) {
                  if let Some(pub_dress) = state
                      .remembered_bond_signer
                      .verify(&hint, now)
                      .and_then(|candidate| PubDress::from_str(&candidate).ok())
                  {
                      return no_store_json(
                          StatusCode::OK,
                          NativeContextResponse::remembered(pub_dress.to_string()),
                      );
                  }
              }
          '''
          new_hint = '''    if let Some(hint) = read_cookie(&headers, REMEMBERED_BOND_COOKIE)
                  && let Some(pub_dress) = state
                      .remembered_bond_signer
                      .verify(&hint, now)
                      .and_then(|candidate| PubDress::from_str(&candidate).ok())
              {
                  return no_store_json(
                      StatusCode::OK,
                      NativeContextResponse::remembered(pub_dress.to_string()),
                  );
              }
          '''
          if old_hint in api:
              api = api.replace(old_hint, new_hint, 1)

          old_now = '''fn now(state: &ApiState) -> Result<u64, Response> {
              state.clock.now_unix_seconds().map_err(|_| unavailable())
          }
          '''
          new_now = '''fn now(state: &ApiState) -> Result<u64, ClockError> {
              state.clock.now_unix_seconds().inspect_err(|error| {
                  tracing::error!(?error, "system clock is before unix epoch");
              })
          }
          '''
          if old_now in api:
              api = api.replace(old_now, new_now, 1)

          old_clock_match = '''    let now = match now(&state) {
                  Ok(value) => value,
                  Err(response) => return response,
              };
          '''
          new_clock_match = '''    let now = match now(&state) {
                  Ok(value) => value,
                  Err(_) => return unavailable(),
              };
          '''
          count = api.count(old_clock_match)
          if count == 0:
              raise SystemExit("expected at least one clock match to update")
          api = api.replace(old_clock_match, new_clock_match)
          api_path.write_text(api)

          repository_path = Path("services/identity/src/repository.rs")
          repository = repository_path.read_text()
          old_assert = '''        assert_eq!(
                      repository
                          .find_native_credential(&address)
                          .await
                          .expect("credential lookup")
                          .expect("credential")
                          .active,
                      false
                  );
          '''
          new_assert = '''        assert!(
                      !repository
                          .find_native_credential(&address)
                          .await
                          .expect("credential lookup")
                          .expect("credential")
                          .active
                  );
          '''
          if old_assert not in repository:
              raise SystemExit("expected boolean assertion to update")
          repository = repository.replace(old_assert, new_assert, 1)
          repository_path.write_text(repository)
          PY
          cargo fmt --manifest-path services/identity/Cargo.toml --all
          git add services/identity/src
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(identity): satisfy Rust lint gates"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
