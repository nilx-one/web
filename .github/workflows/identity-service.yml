name: Identity Service CI

on:
  pull_request:
    paths:
      - "services/identity/**"
      - "packages/application/**"
      - "packages/identity-http/**"
      - "packages/product-app/**"
      - "deploy/web/targets.json"
      - ".github/workflows/identity-service.yml"

permissions:
  contents: write

jobs:
  apply-final-fix:
    if: github.head_ref == 'feature/browser-provider-auth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply final browser auth integration
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          rust = "services/identity/src/browser_web_auth.rs"
          replace_count(
              rust,
              "            Err(response) => return response,",
              "            Err(code) => return callback_failure(code),",
              2,
          )
          replace_once(
              rust,
              ") -> Result<OAuthTransaction, Response> {",
              ") -> Result<OAuthTransaction, &'static str> {",
          )
          for code in (
              "provider_authorization_rejected",
              "provider_callback_invalid",
              "provider_callback_expired",
              "provider_authentication_unavailable",
          ):
              old = f'return Err(callback_failure("{code}"));'
              new = f'return Err("{code}");'
              text = Path(rust).read_text()
              if old not in text:
                  raise SystemExit(f"{rust}: missing callback error {code}")
              Path(rust).write_text(text.replace(old, new))

          Path("services/identity/deploy/contract.version").write_text("5\n")
          targets_path = Path("deploy/web/targets.json")
          targets = json.loads(targets_path.read_text())
          if targets["targets"]["web"].get("requiresIdentityContract") != 4:
              raise SystemExit("deploy/web/targets.json: expected web identity contract 4")
          targets["targets"]["web"]["requiresIdentityContract"] = 5
          targets_path.write_text(json.dumps(targets, indent=2) + "\n")

          app = "packages/product-app/src/index.tsx"
          replace_once(
              app,
              "  AuthenticateNativeIdentity,\n  ForgetRememberedBond,\n  LogoutNativeIdentity,\n  ReadNativeIdentityContext,",
              "  AuthenticateNativeIdentity,\n  BeginBrowserProviderAuthorization,\n  ForgetRememberedBond,\n  LinkBrowserProvider,\n  LogoutNativeIdentity,\n  ReadBrowserProviderContext,\n  ReadNativeIdentityContext,",
          )
          replace_once(
              app,
              "  formatPubDress,\n  type CoreRuntimePort,",
              "  formatPubDress,\n  type BrowserIdentityProvider,\n  type CoreRuntimePort,",
          )
          replace_once(
              app,
              "  createProviderIdentityViewState,\n  createPubDressStatusViewState,\n} from \"./features/identity/identity-foundation-view-model\";",
              "  createProviderIdentityViewState,\n  createPubDressStatusViewState,\n  type IdentityViewState,\n} from \"./features/identity/identity-foundation-view-model\";",
          )
          replace_once(
              app,
              "function validNativePassword(password: string): boolean {\n  const normalized = password.normalize(\"NFC\");\n  const length = [...normalized].length;\n  return (\n    length >= 8 &&\n    length <= 128 &&\n    normalized.trim() === normalized &&\n    !/[\\p{Cc}\\u2028\\u2029]/u.test(normalized)\n  );\n}\n",
              "function validNativePassword(password: string): boolean {\n  const normalized = password.normalize(\"NFC\");\n  const length = [...normalized].length;\n  return (\n    length >= 8 &&\n    length <= 128 &&\n    normalized.trim() === normalized &&\n    !/[\\p{Cc}\\u2028\\u2029]/u.test(normalized)\n  );\n}\n\nfunction providerDisplayName(provider: BrowserIdentityProvider): string {\n  return provider === \"telegram\" ? \"Telegram\" : \"Discord\";\n}\n",
          )
          replace_once(
              app,
              "  const providerIdentityQuery = useQuery({\n    queryKey: [\"provider-identity\", host.kind],",
              "  const browserProviderContextQuery = useQuery({\n    queryKey: [\"browser-provider-context\"],\n    queryFn: () =>\n      new ReadBrowserProviderContext(dependencies.identity).execute(),\n    enabled: browserHost,\n    retry: false,\n    staleTime: 0,\n  });\n  const providerIdentityQuery = useQuery({\n    queryKey: [\"provider-identity\", host.kind],",
          )
          replace_once(
              app,
              "  const forgetRemembered = useMutation({",
              "  const browserProviderLink = useMutation({\n    mutationFn: (expectedPubDress: string) =>\n      new LinkBrowserProvider(dependencies.identity).execute(expectedPubDress),\n    onSuccess: (result) => {\n      if (result.kind === \"linked\") {\n        void queryClient.invalidateQueries({\n          queryKey: [\"browser-provider-context\"],\n        });\n      }\n    },\n  });\n  const forgetRemembered = useMutation({",
          )
          replace_count(
              app,
              "      recoveryAcknowledgement.reset();\n      setUseRememberedHint",
              "      recoveryAcknowledgement.reset();\n      browserProviderLink.reset();\n      setUseRememberedHint",
              1,
          )
          replace_once(
              app,
              "      recoveryAcknowledgement.reset();\n      setSelection({ discriminator: \"0\", slug: \"\" });",
              "      recoveryAcknowledgement.reset();\n      browserProviderLink.reset();\n      setSelection({ discriminator: \"0\", slug: \"\" });",
          )
          old_identity = '''  const identityState = browserHost
    ? createNativeIdentityViewState(
        nativeContextQuery.data?.kind === "remembered" && !useRememberedHint
          ? { kind: "anonymous" }
          : nativeContextQuery.data,
        status,
        nativeRegistration.data,
        latestAuthentication,
        nativePending,
      )
    : createProviderIdentityViewState(
        host,
        providerIdentityQuery.data,
        providerRegistration.data,
        status,
        providerRegistration.isPending ||
          providerPassword.isPending ||
          recoveryAcknowledgement.isPending,
        providerPassword.data,
        recoveryAcknowledgement.data,
      );
'''
          new_identity = '''  const nativeIdentityState = createNativeIdentityViewState(
    nativeContextQuery.data?.kind === "remembered" && !useRememberedHint
      ? { kind: "anonymous" }
      : nativeContextQuery.data,
    status,
    nativeRegistration.data,
    latestAuthentication,
    nativePending,
  );
  const pendingBrowserProvider =
    browserProviderContextQuery.data?.kind === "pending"
      ? browserProviderContextQuery.data.provider
      : undefined;
  const authenticatedNativeBond = nativeIdentityState.kind === "authenticated";

  useEffect(() => {
    if (
      !browserHost ||
      pendingBrowserProvider === undefined ||
      !authenticatedNativeBond ||
      browserProviderLink.isPending ||
      browserProviderLink.data !== undefined
    ) {
      return;
    }
    browserProviderLink.mutate(nativeIdentityState.pubDress);
  }, [
    authenticatedNativeBond,
    browserHost,
    browserProviderLink,
    nativeIdentityState,
    pendingBrowserProvider,
  ]);

  let identityState: IdentityViewState = browserHost
    ? nativeIdentityState
    : createProviderIdentityViewState(
        host,
        providerIdentityQuery.data,
        providerRegistration.data,
        status,
        providerRegistration.isPending ||
          providerPassword.isPending ||
          recoveryAcknowledgement.isPending,
        providerPassword.data,
        recoveryAcknowledgement.data,
      );
  if (
    browserHost &&
    pendingBrowserProvider !== undefined &&
    nativeIdentityState.kind === "authenticated"
  ) {
    const provider = providerDisplayName(pendingBrowserProvider);
    const linkResult = browserProviderLink.data;
    if (linkResult?.kind === "linked") {
      identityState = nativeIdentityState;
    } else if (linkResult?.kind === "rejected") {
      identityState = {
        kind: "unavailable",
        detail:
          linkResult.reason === "provider-already-linked"
            ? `${provider} is already connected to another Bond.`
            : `Could not connect ${provider} to this Bond. Authorize ${provider} again.`,
      };
    } else if (linkResult?.kind === "service-unavailable") {
      identityState = {
        kind: "unavailable",
        detail: `Could not connect ${provider} right now.`,
      };
    } else {
      identityState = {
        kind: "loading",
        detail: `Connecting ${provider} to ${nativeIdentityState.pubDress}…`,
      };
    }
  }
'''
          replace_once(app, old_identity, new_identity)
          replace_once(
              app,
              "  useEffect(() => {\n    if (\n      pendingAutofillCredential.current === undefined ||",
              "  function authorizeBrowserProvider(provider: BrowserIdentityProvider): void {\n    const url = new BeginBrowserProviderAuthorization(\n      dependencies.identity,\n    ).execute(provider);\n    if (url !== undefined) {\n      window.location.assign(url);\n    }\n  }\n\n  useEffect(() => {\n    if (\n      pendingAutofillCredential.current === undefined ||",
          )
          replace_once(
              app,
              "  return (\n    <IdentityFoundationView\n      password={password}",
              "  const providerContext = browserProviderContextQuery.data;\n  const browserProviderAuth = browserHost\n    ? {\n        available:\n          providerContext?.kind === \"none\" || providerContext?.kind === \"pending\"\n            ? providerContext.available\n            : { telegram: false, discord: false },\n        onAuthorize: authorizeBrowserProvider,\n        ...(pendingBrowserProvider === undefined\n          ? {}\n          : { pendingProvider: pendingBrowserProvider }),\n      }\n    : undefined;\n\n  return (\n    <IdentityFoundationView\n      password={password}",
          )
          replace_once(
              app,
              "      selection={selection}\n      viewModel={viewModel}\n      onCredentialAutofill",
              "      selection={selection}\n      viewModel={viewModel}\n      {...(browserProviderAuth === undefined ? {} : { browserProviderAuth })}\n      onCredentialAutofill",
          )

          view = "packages/product-app/src/features/identity/identity-foundation-view.tsx"
          replace_once(
              view,
              "  parsePubDress,\n  type CorePubDressLabelResult,",
              "  parsePubDress,\n  type BrowserIdentityProvider,\n  type CorePubDressLabelResult,",
          )
          replace_once(
              view,
              "export interface IdentityFoundationViewProps {\n  password: string;",
              "export interface BrowserProviderAuthViewState {\n  available: {\n    telegram: boolean;\n    discord: boolean;\n  };\n  pendingProvider?: BrowserIdentityProvider;\n  onAuthorize(provider: BrowserIdentityProvider): void;\n}\n\nexport interface IdentityFoundationViewProps {\n  password: string;",
          )
          replace_once(
              view,
              "  selection: PubDressSelection;\n  viewModel: IdentityFoundationViewModel;",
              "  selection: PubDressSelection;\n  viewModel: IdentityFoundationViewModel;\n  browserProviderAuth?: BrowserProviderAuthViewState;",
          )
          old_row = '''function ProviderRow() {
  return (
    <section className="provider-row" aria-labelledby="provider-row-label">
      <span id="provider-row-label">Sign in with</span>
      <div className="provider-buttons">
        <button type="button" disabled aria-label="Telegram — coming next">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 11 15-6-4.7 14-3.6-4.1L8 17l.6-4.1L17 7.4 6.4 12.2 4 11Z" />
          </svg>
          <span>Telegram</span>
          <small>next</small>
        </button>
        <button type="button" disabled aria-label="Discord — coming later">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.2 7.2A14 14 0 0 1 12 6.3a14 14 0 0 1 4.8.9c1.1 1.6 2 4.3 2.2 6.5a12 12 0 0 1-3.2 2.1l-.8-1.1a8.6 8.6 0 0 0 1.4-.7c-2.7 1.2-6.1 1.2-8.8 0 .4.3.9.5 1.4.7l-.8 1.1A12 12 0 0 1 5 13.7c.2-2.2 1.1-4.9 2.2-6.5Z" />
            <circle cx="9.5" cy="11.5" r="1" />
            <circle cx="14.5" cy="11.5" r="1" />
          </svg>
          <span>Discord</span>
          <small>later</small>
        </button>
      </div>
    </section>
  );
}
'''
          new_row = '''function ProviderRow({
  auth,
}: {
  auth: BrowserProviderAuthViewState | undefined;
}) {
  const pendingLabel =
    auth?.pendingProvider === "telegram"
      ? "Telegram"
      : auth?.pendingProvider === "discord"
        ? "Discord"
        : undefined;
  return (
    <section className="provider-row" aria-labelledby="provider-row-label">
      <span id="provider-row-label">Sign in with</span>
      <div className="provider-buttons">
        <button
          type="button"
          disabled={auth?.available.telegram !== true}
          aria-label="Sign in with Telegram"
          onClick={() => auth?.onAuthorize("telegram")}
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 11 15-6-4.7 14-3.6-4.1L8 17l.6-4.1L17 7.4 6.4 12.2 4 11Z" />
          </svg>
          <span>Telegram</span>
          <small>web</small>
        </button>
        <button
          type="button"
          disabled={auth?.available.discord !== true}
          aria-label="Sign in with Discord"
          onClick={() => auth?.onAuthorize("discord")}
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7.2 7.2A14 14 0 0 1 12 6.3a14 14 0 0 1 4.8.9c1.1 1.6 2 4.3 2.2 6.5a12 12 0 0 1-3.2 2.1l-.8-1.1a8.6 8.6 0 0 0 1.4-.7c-2.7 1.2-6.1 1.2-8.8 0 .4.3.9.5 1.4.7l-.8 1.1A12 12 0 0 1 5 13.7c.2-2.2 1.1-4.9 2.2-6.5Z" />
            <circle cx="9.5" cy="11.5" r="1" />
            <circle cx="14.5" cy="11.5" r="1" />
          </svg>
          <span>Discord</span>
          <small>web</small>
        </button>
      </div>
      {pendingLabel === undefined ? null : (
        <p className="identity-status identity-status--available" aria-live="polite">
          {pendingLabel} verified. Already have a Bond? Sign in below and we’ll
          connect {pendingLabel}. New here? Create your Bond below.
        </p>
      )}
    </section>
  );
}
'''
          replace_once(view, old_row, new_row)
          replace_once(
              view,
              "export function IdentityFoundationView({\n  password,",
              "export function IdentityFoundationView({\n  browserProviderAuth,\n  password,",
          )
          replace_once(view, "                <ProviderRow />", "                <ProviderRow auth={browserProviderAuth} />")
          PY

          cargo fmt --manifest-path services/identity/Cargo.toml --all
          git fetch origin master --depth=1
          git show FETCH_HEAD:.github/workflows/identity-service.yml > .github/workflows/identity-service.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/identity/src/browser_web_auth.rs \
            services/identity/deploy/contract.version \
            deploy/web/targets.json \
            packages/product-app/src/index.tsx \
            packages/product-app/src/features/identity/identity-foundation-view.tsx \
            .github/workflows/identity-service.yml
          git commit -m "fix(auth): complete browser provider integration"
          git push origin HEAD:${GITHUB_HEAD_REF}
