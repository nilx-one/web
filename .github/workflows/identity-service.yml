name: Identity Service CI

on:
  pull_request:
    paths:
      - "services/identity/**"
      - ".github/workflows/identity-service.yml"

permissions:
  contents: write

jobs:
  apply-rustfmt:
    name: Apply rustfmt to PR branch
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format identity service
        run: |
          set -Eeuo pipefail
          cargo fmt --manifest-path services/identity/Cargo.toml --all
          git add services/identity/src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(identity): apply rustfmt"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
