name: Package Telegram Mini App

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: package-telegram-mini-app-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nilx-one/0x1-telegram-mini-app

jobs:
  package:
    name: Package immutable image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Telegram host artifact
        run: pnpm --filter @nilx-one/telegram-mini-app build
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/telegram-mini-app/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
