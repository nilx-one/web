# Producer-side preflight only. Infra owns activation and server credentials.
# Run "Reconcile deliveries" in aiaiaiai-org/infra to request a deployment.
name: Production Delivery Preflight

on:
  workflow_dispatch:
    inputs:
      target:
        description: Client workload to verify (Identity is not yet migrated)
        required: true
        type: choice
        default: all
        options:
          - all
          - web
          - telegram
          - discord

permissions:
  contents: read
  packages: read
  attestations: read

jobs:
  preflight:
    name: Validate production delivery candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable master image and target contracts
        env:
          TARGET: ${{ inputs.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Automatic production delivery accepts only master."
            exit 1
          fi
          image="ghcr.io/nilx-one/web:$GITHUB_SHA"
          jq -e '.schema == 1 and .deployOrder == ["web", "telegram", "discord"]' deploy/web/targets.json >/dev/null
          if [[ "$TARGET" != all ]]; then
            jq -e --arg target "$TARGET" '.targets[$target] != null' deploy/web/targets.json >/dev/null
          fi
          docker buildx imagetools inspect "$image" >/dev/null
          gh attestation verify "oci://$image" --repo "$GITHUB_REPOSITORY" >/dev/null
          {
            echo "### Verified delivery candidate"
            echo
            echo "- Source: `$GITHUB_SHA` (master)"
            echo "- Image: `$image`"
            echo "- Target: `$TARGET`"
            echo
            echo "This workflow does not deploy or dispatch another repository."
            echo "To reconcile production, run **Reconcile deliveries** in"
            echo "[aiaiaiai-org/infra](https://github.com/aiaiaiai-org/infra/actions/workflows/reconcile-deliveries.yml)."
            echo "Select the matching workload (nilxone-web, nilxone-telegram, nilxone-discord),"
            echo "or leave it blank for all automatic workloads."
          } >> "$GITHUB_STEP_SUMMARY"
