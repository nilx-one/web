name: Format GitHub auth provider changes

on:
  push:
    branches:
      - feature/github-auth-provider
    paths:
      - .github/workflows/format-github-auth-provider.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/github-auth-provider
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier
        run: pnpm exec prettier --write packages/product-app/src/index.tsx
      - name: Remove temporary formatter
        run: rm -f .github/workflows/format-github-auth-provider.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format GitHub auth provider integration"
          git push origin HEAD:feature/github-auth-provider
