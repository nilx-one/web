# Temporary formatter: remove from the PR branch before merge.
name: Temporary character-doc format
on:
  push:
    branches:
      - docs/character-label-occlusion-20261025
    paths:
      - .github/workflows/format-character-doc-temp.yml
jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/character-label-occlusion.md
      - name: Commit formatted document
        run: |
          git config user.name "0x0sky"
          git config user.email "0x0sky@aiaiaiai.org"
          git add docs/character-label-occlusion.md
          if ! git diff --cached --quiet; then
            git commit -m "style(docs): apply repository Prettier output" -m "Co-authored-by: x0skai <x0skai@aiaiaiai.org>"
            git push origin HEAD:docs/character-label-occlusion-20261025
          fi
