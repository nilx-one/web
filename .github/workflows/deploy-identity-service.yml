name: Deploy Identity Dependency

on:
  workflow_call:
    inputs:
      release_sha:
        description: Release commit whose dependency graph is being activated
        required: true
        type: string
      required_contract:
        description: Minimum identity contract required by selected client targets
        required: true
        type: number
      force:
        description: Redeploy the latest verified identity package even when the active contract is sufficient
        required: true
        type: boolean
    secrets:
      INFRA_DEPLOY_TOKEN:
        required: false
      TELOXIDE_TOKEN:
        required: false
      TELEGRAM_OIDC_CLIENT_SECRET:
        required: false
      DISCORD_CLIENT_SECRET:
        required: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  package:
    name: Resolve verified identity package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package_sha: ${{ steps.package.outputs.package_sha }}
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REQUIRED_IDENTITY_CONTRACT: ${{ inputs.required_contract }}
      FORCE_IDENTITY: ${{ inputs.force }}
      IMAGE_REPOSITORY: ghcr.io/nilx-one/0x1-identity

    steps:
      - name: Validate provider credentials
        env:
          TELOXIDE_TOKEN: ${{ secrets.TELOXIDE_TOKEN }}
          TELEGRAM_OIDC_CLIENT_SECRET: ${{ secrets.TELEGRAM_OIDC_CLIENT_SECRET }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          set -Eeuo pipefail
          test -n "$TELOXIDE_TOKEN" || { echo "Missing repository secret TELOXIDE_TOKEN." >&2; exit 1; }
          test -n "$TELEGRAM_OIDC_CLIENT_SECRET" || { echo "Missing repository secret TELEGRAM_OIDC_CLIENT_SECRET." >&2; exit 1; }
          test -n "$DISCORD_CLIENT_SECRET" || { echo "Missing repository secret DISCORD_CLIENT_SECRET." >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate dependency request
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUIRED_IDENTITY_CONTRACT" =~ ^[0-9]+$ ]]

      - id: package
        name: Resolve latest verified identity package in release ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          package_ready=false

          for attempt in $(seq 1 40); do
            response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/package-identity-service.yml/runs" -f per_page=100)"
            candidate=""
            while IFS=$'\t' read -r sha status conclusion url; do
              [ -n "$sha" ] || continue
              if git merge-base --is-ancestor "$sha" "$RELEASE_SHA"; then
                candidate="$sha"$'\t'"$status"$'\t'"$conclusion"$'\t'"$url"
                break
              fi
            done < <(jq -r '.workflow_runs[] | [.head_sha, .status, (.conclusion // ""), .html_url] | @tsv' <<<"$response")

            if [ -z "$candidate" ]; then
              echo "No Package Identity Service run is registered in the release ancestry yet (attempt $attempt/40)."
              sleep 10
              continue
            fi

            IFS=$'\t' read -r package_sha package_status package_conclusion package_url <<<"$candidate"
            if [ "$package_status" = completed ]; then
              if [ "$package_conclusion" != success ]; then
                echo "Latest identity package in release ancestry failed: $package_conclusion" >&2
                echo "$package_url" >&2
                exit 1
              fi
              package_ready=true
              break
            fi
            echo "Identity package $package_sha is $package_status (attempt $attempt/40)."
            sleep 10
          done

          if [ "$package_ready" != true ]; then
            echo "Timed out waiting for the identity package required by $RELEASE_SHA." >&2
            exit 1
          fi

          echo "package_sha=$package_sha" >>"$GITHUB_OUTPUT"

  deploy:
    name: Deploy identity through infra
    needs: package
    uses: aiaiaiai-org/infra/.github/workflows/deploy-workload.yml@fix/dynamic-web-provider-env
    with:
      workload: nilxone-identity
      image: ghcr.io/nilx-one/0x1-identity:sha-${{ needs.package.outputs.package_sha }}
      source_repository: ${{ github.repository }}
      ref: ${{ inputs.release_sha }}
      telegram_oidc_client_id: ${{ vars.TELEGRAM_OIDC_CLIENT_ID }}
      discord_client_id: ${{ vars.DISCORD_CLIENT_ID }}
    secrets:
      TELOXIDE_TOKEN: ${{ secrets.TELOXIDE_TOKEN }}
      TELEGRAM_OIDC_CLIENT_SECRET: ${{ secrets.TELEGRAM_OIDC_CLIENT_SECRET }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
