name: Deploy Identity Dependency

on:
  workflow_call:
    inputs:
      release_sha:
        description: Release commit whose dependency graph is being activated
        required: true
        type: string
      required_contract:
        description: Minimum identity contract required by selected client targets
        required: true
        type: number
      force:
        description: Redeploy the latest verified identity package even when it is already active
        required: true
        type: boolean
    secrets:
      INFRA_DEPLOY_TOKEN:
        required: false
      TELOXIDE_TOKEN:
        required: false
      TELEGRAM_OIDC_CLIENT_SECRET:
        required: false
      DISCORD_CLIENT_SECRET:
        required: false

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  deploy:
    name: Ensure identity contract ${{ inputs.required_contract }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      REQUIRED_IDENTITY_CONTRACT: ${{ inputs.required_contract }}
      FORCE_IDENTITY: ${{ inputs.force }}
      IMAGE_REPOSITORY: ghcr.io/nilx-one/0x1-identity
      INFRA_REPOSITORY: aiaiaiai-org/infra
      INFRA_DEPLOY_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
      TELEGRAM_OIDC_CLIENT_ID: ${{ vars.TELEGRAM_OIDC_CLIENT_ID }}
      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate dependency request
        run: |
          set -Eeuo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REQUIRED_IDENTITY_CONTRACT" =~ ^[0-9]+$ ]]
          test -n "$INFRA_DEPLOY_TOKEN" || { echo "Missing repository secret INFRA_DEPLOY_TOKEN." >&2; exit 1; }
          test -n "$TELEGRAM_OIDC_CLIENT_ID" || { echo "Missing repository variable TELEGRAM_OIDC_CLIENT_ID." >&2; exit 1; }
          test -n "$DISCORD_CLIENT_ID" || { echo "Missing repository variable DISCORD_CLIENT_ID." >&2; exit 1; }

      - id: package
        name: Resolve latest verified identity package in release ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          package_ready=false

          for attempt in $(seq 1 40); do
            response="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/package-identity-service.yml/runs" -f per_page=100)"
            candidate=""
            while IFS=$'\t' read -r sha status conclusion url; do
              [ -n "$sha" ] || continue
              if git merge-base --is-ancestor "$sha" "$RELEASE_SHA"; then
                candidate="$sha"$'\t'"$status"$'\t'"$conclusion"$'\t'"$url"
                break
              fi
            done < <(jq -r '.workflow_runs[] | [.head_sha, .status, (.conclusion // ""), .html_url] | @tsv' <<<"$response")

            if [ -z "$candidate" ]; then
              echo "No Package Identity Service run is registered in the release ancestry yet (attempt $attempt/40)."
              sleep 10
              continue
            fi

            IFS=$'\t' read -r package_sha package_status package_conclusion package_url <<<"$candidate"
            if [ "$package_status" = completed ]; then
              if [ "$package_conclusion" != success ]; then
                echo "Latest identity package in release ancestry failed: $package_conclusion" >&2
                echo "$package_url" >&2
                exit 1
              fi
              package_ready=true
              break
            fi
            echo "Identity package $package_sha is $package_status (attempt $attempt/40)."
            sleep 10
          done

          if [ "$package_ready" != true ]; then
            echo "Timed out waiting for the identity package required by $RELEASE_SHA." >&2
            exit 1
          fi

          echo "package_sha=$package_sha" >>"$GITHUB_OUTPUT"
          echo "IDENTITY_IMAGE=${IMAGE_REPOSITORY}:sha-${package_sha}" >>"$GITHUB_ENV"
          echo "IDENTITY_RELEASE_SHA=${package_sha}" >>"$GITHUB_ENV"

      - name: Validate infra deployment credential
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          if ! gh api --method GET "repos/${INFRA_REPOSITORY}/actions/workflows/deploy-workload.yml" >/dev/null; then
            echo "::error::INFRA_DEPLOY_TOKEN cannot read Actions workflows in ${INFRA_REPOSITORY}. Grant the token Actions: Read access to the infra repository." >&2
            exit 1
          fi

      - id: need
        name: Decide whether identity must be activated
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          active_image="$(bash deploy/infra-workload.sh active-image nilxone-identity)"
          echo "IDENTITY_ACTIVE_IMAGE=${active_image:-none}" >>"$GITHUB_ENV"

          decision="$(ACTIVE_IMAGE="$active_image" bash deploy/identity-activation.sh)"
          deploy="$(sed -n 's/^deploy=//p' <<<"$decision")"
          reason="$(sed -n 's/^reason=//p' <<<"$decision")"
          [[ "$deploy" =~ ^(true|false)$ ]]

          echo "Identity activation required: $deploy ($reason)."
          echo "deploy=$deploy" >>"$GITHUB_OUTPUT"
          echo "IDENTITY_DECISION=$reason" >>"$GITHUB_ENV"

      - id: provider
        name: Publish transient provider environment
        if: steps.need.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          TELOXIDE_TOKEN: ${{ secrets.TELOXIDE_TOKEN }}
          TELEGRAM_OIDC_CLIENT_SECRET: ${{ secrets.TELEGRAM_OIDC_CLIENT_SECRET }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          set -Eeuo pipefail

          for name in TELOXIDE_TOKEN TELEGRAM_OIDC_CLIENT_SECRET DISCORD_CLIENT_SECRET; do
            test -n "${!name:-}" || { echo "Missing repository secret $name." >&2; exit 1; }
          done

          echo "published=true" >>"$GITHUB_OUTPUT"

          for name in TELOXIDE_TOKEN TELEGRAM_OIDC_CLIENT_SECRET DISCORD_CLIENT_SECRET; do
            if ! gh secret set "$name" --repo "$INFRA_REPOSITORY" --body "${!name}"; then
              echo "::error::Could not write secret $name to ${INFRA_REPOSITORY}. INFRA_DEPLOY_TOKEN needs Secrets: Read and write access there." >&2
              exit 1
            fi
          done

          echo "Provider credentials are readable by ${INFRA_REPOSITORY} for this deployment only."

      - id: dispatch
        name: Request infra identity deployment
        if: steps.need.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          baseline="$(bash deploy/infra-workload.sh latest-run-id)"
          echo "baseline_run_id=$baseline" >>"$GITHUB_OUTPUT"

          jq -n \
            --arg workload "nilxone-identity" \
            --arg image "$IDENTITY_IMAGE" \
            --arg source "$GITHUB_REPOSITORY" \
            --arg ref "$RELEASE_SHA" \
            --arg telegram_oidc_client_id "$TELEGRAM_OIDC_CLIENT_ID" \
            --arg discord_client_id "$DISCORD_CLIENT_ID" \
            '{
              event_type: "deploy-workload",
              client_payload: {
                workload: $workload,
                image: $image,
                source_repository: $source,
                ref: $ref,
                telegram_oidc_client_id: $telegram_oidc_client_id,
                discord_client_id: $discord_client_id
              }
            }' |
            gh api --method POST "repos/${INFRA_REPOSITORY}/dispatches" --input -

      - name: Wait for infra deployment
        if: steps.need.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          BASELINE_RUN_ID: ${{ steps.dispatch.outputs.baseline_run_id }}
        run: bash deploy/infra-workload.sh await nilxone-identity "$IDENTITY_IMAGE" "$BASELINE_RUN_ID"

      - name: Revoke transient provider environment
        if: always() && steps.provider.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
        run: |
          set -Eeuo pipefail
          revoked=true

          for name in TELOXIDE_TOKEN TELEGRAM_OIDC_CLIENT_SECRET DISCORD_CLIENT_SECRET; do
            if ! gh secret delete "$name" --repo "$INFRA_REPOSITORY"; then
              revoked=false
              echo "::error::Could not remove the transient provider secret $name from ${INFRA_REPOSITORY}. Remove it by hand before the next deployment."
            fi
          done

          [ "$revoked" = true ]

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### 0x1 identity dependency"
            echo
            echo "- release request: \`$RELEASE_SHA\`"
            echo "- required contract: \`$REQUIRED_IDENTITY_CONTRACT\`"
            echo "- force requested: \`$FORCE_IDENTITY\`"
            echo "- identity package: \`${IDENTITY_RELEASE_SHA:-unknown}\`"
            echo "- previously active: \`${IDENTITY_ACTIVE_IMAGE:-unknown}\`"
            echo "- activation: \`${{ steps.need.outputs.deploy || 'not decided' }}\` (${IDENTITY_DECISION:-see the decision step log})"
            echo "- provider environment: \`transient\`"
            echo "- result: \`${{ job.status }}\`"
          } >>"$GITHUB_STEP_SUMMARY"
