name: Bootstrap avatar MapLibre change

on:
  push:
    branches: [feature/avatar-maplibre-layer]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/avatar-maplibre-layer
      - name: Apply verified local change
        run: |
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IrRDKwwKo7Vypiv8TSaUP0zR2J/724ac4d4-7a00-46a6-9bf0-1a6a322e638e.zip' -o /tmp/avatar-change.zip
          unzip -o /tmp/avatar-change.zip
          rm .github/workflows/bootstrap-avatar-maplibre.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/map-contract/src/index.ts packages/map-maplibre pnpm-lock.yaml .github/workflows/bootstrap-avatar-maplibre.yml
          git commit -m 'feat(map): render local rigged avatars'
          git push origin HEAD:feature/avatar-maplibre-layer
