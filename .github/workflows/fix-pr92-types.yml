name: Fix PR 92 types

on:
  push:
    branches:
      - claude/subdomain-registration-xjk8jc

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/subdomain-registration-xjk8jc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make explicit unavailable Core results type-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("packages/product-app/src/features/identity/identity-foundation-view.tsx"): [
                  (
                      "pubDressLabelDerivation?: CorePubDressLabelResult;",
                      "pubDressLabelDerivation?: CorePubDressLabelResult | undefined;",
                  ),
              ],
              Path("packages/product-app/src/features/identity/pub-dress-url-view-model.ts"): [
                  (
                      "readonly derivation?: CorePubDressLabelResult;",
                      "readonly derivation?: CorePubDressLabelResult | undefined;",
                  ),
                  (
                      "readonly composition?: CorePubDressLabelResult;",
                      "readonly composition?: CorePubDressLabelResult | undefined;",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text()
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"expected text missing in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - run: pnpm exec prettier --write packages/product-app/src/features/identity/identity-foundation-view.tsx packages/product-app/src/features/identity/pub-dress-url-view-model.ts
      - run: pnpm typecheck
      - name: Commit type fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/product-app/src/features/identity/identity-foundation-view.tsx packages/product-app/src/features/identity/pub-dress-url-view-model.ts
          git commit -m "fix(identity): model unavailable Core label results explicitly"
          git push origin HEAD:claude/subdomain-registration-xjk8jc
