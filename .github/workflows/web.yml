name: Web

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository policy
        run: pnpm policy
      - name: Verify formatting
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test contracts and integration
        run: pnpm test
      - name: Checkout pinned Core runtime source
        uses: actions/checkout@v4
        with:
          repository: nilx-one/core
          ref: e09a42184951b6f40ad4b11eedf6e48c5b6a0ac9
          path: .core-source
          persist-credentials: false
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Prepare verified Core Wasm runtime
        run: |
          ./scripts/prepare_core_wasm_runtime.sh .core-source
          rm -rf .core-source
      - name: Build every Web host
        run: pnpm build
      - name: Verify Core runtime in every host artifact
        run: |
          expected=d55bd185a9ec108cf83c0394c350c094cae9c09e381a1c22b11e388b1cd93320
          for host in site telegram-mini-app discord-activity; do
            runtime="apps/$host/dist/core/0.1.0/index_bg.wasm"
            test -f "$runtime"
            printf '%s  %s\n' "$expected" "$runtime" | sha256sum --check --status
          done
      - name: Validate deploy target contract
        run: |
          set -Eeuo pipefail
          identity_contract="$(tr -d '[:space:]' < services/identity/deploy/contract.version)"
          [[ "$identity_contract" =~ ^[0-9]+$ ]]
          jq -e --argjson identity "$identity_contract" '
            .schema == 1
            and (.deployOrder == ["web", "telegram", "discord"])
            and ([.deployOrder[] as $name | .targets[$name]] | all(. != null))
            and ([.targets[] | .requiresIdentityContract <= $identity] | all)
            and ([.targets[] | (.publicPath | startswith("/"))] | all)
            and (.targets.web.app == "site")
            and (.targets.telegram.app == "telegram-mini-app")
            and (.targets.discord.app == "discord-activity")
          ' deploy/web/targets.json >/dev/null
      - name: Preserve verified host builds for deploy validation
        uses: actions/upload-artifact@v4
        with:
          name: web-host-dist-${{ github.sha }}
          path: |
            apps/site/dist
            apps/telegram-mini-app/dist
            apps/discord-activity/dist
          retention-days: 1

  deploy-validation:
    name: Validate client deploy package
    if: github.event_name == 'pull_request'
    needs: full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate client deployment scripts
        run: |
          sh -n \
            deploy/web/deploy.sh \
            deploy/web/bootstrap-basemap.sh \
            deploy/web/check-public.sh \
            deploy/web/check-public.test.sh \
            deploy/web/check-map-public.sh \
            deploy/web/check-map-public.test.sh
          sh deploy/web/check-public.test.sh
          sh deploy/web/check-map-public.test.sh
      - name: Reuse verified Web host builds
        uses: actions/download-artifact@v4
        with:
          name: web-host-dist-${{ github.sha }}
          path: .
      - name: Restore artifact paths
        run: |
          set -Eeuo pipefail
          test -d site/dist
          test -d telegram-mini-app/dist
          test -d discord-activity/dist
          mkdir -p apps/site apps/telegram-mini-app apps/discord-activity
          mv site/dist apps/site/dist
          mv telegram-mini-app/dist apps/telegram-mini-app/dist
          mv discord-activity/dist apps/discord-activity/dist
      - name: Validate immutable multi-host runtime image
        run: docker build --file deploy/web/Dockerfile --tag 0x1-clients:ci .
      - name: Verify every host runtime
        run: |
          set -Eeuo pipefail
          port=18080
          while IFS=$'\t' read -r target root; do
            container_id="$(docker run --detach --env "CLIENT_ROOT=$root" --publish "$port:8080" 0x1-clients:ci)"
            trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' RETURN
            ready=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/health" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
            curl --fail --silent --show-error "http://127.0.0.1:$port/" >/dev/null
            docker exec "$container_id" test -f "$root/index.html"
            docker rm --force "$container_id" >/dev/null
            trap - RETURN
            port=$((port + 1))
          done < <(jq -r '.deployOrder[] as $name | [$name, .targets[$name].root] | @tsv' deploy/web/targets.json)
      - name: Validate generic client Compose contract
        run: |
          set -Eeuo pipefail
          COMPOSE_PROJECT_NAME=nilx-one-web \
          CLIENT_NAME=web \
          CLIENT_IMAGE=ghcr.io/nilx-one/0x1-web:sha-${GITHUB_SHA} \
          CLIENT_ROOT=/srv/site \
          EDGE_ALIAS=ox1-web \
          COMPAT_EDGE_ALIAS=ox1-telegram-mini-app \
          MAP_BASEMAP_PATH=/tmp/0x1-basemap.pmtiles \
          RELEASE_SHA="${GITHUB_SHA}" \
            docker compose --file deploy/web/compose.yaml config --quiet
