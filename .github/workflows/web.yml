name: Web

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/avatars/requirements.txt
      - id: avatar-cache
        name: Restore deterministic avatar assets
        uses: actions/cache@v4
        with:
          path: deploy/web/avatars
          key: avatar-assets-v1-${{ runner.os }}-py312-${{ hashFiles('tools/avatars/**') }}
      - name: Install avatar dependencies
        run: python -m pip install -r tools/avatars/requirements.txt
      - name: Build procedural avatar assets
        if: steps.avatar-cache.outputs.cache-hit != 'true'
        run: sh tools/avatars/build.sh
      - name: Verify procedural avatar assets
        run: |
          sha256sum --check tools/avatars/SHA256SUMS
          python tools/avatars/test_rig.py
      - name: Verify repository policy
        run: pnpm policy
      - name: Verify formatting
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test contracts and integration
        run: pnpm test
      - id: core-runtime-cache
        name: Restore pinned Core Wasm runtime
        uses: actions/cache@v4
        with:
          path: |
            apps/site/public/core/0.1.0
            apps/telegram-mini-app/public/core/0.1.0
            apps/discord-activity/public/core/0.1.0
          key: core-wasm-v1-${{ runner.os }}-c224304947280169017e298237bcf5361d1bfb30-wbg-0.2.127-${{ hashFiles('scripts/prepare_core_wasm_runtime.sh') }}
      - name: Checkout pinned Core runtime source
        if: steps.core-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: nilx-one/core
          ref: c224304947280169017e298237bcf5361d1bfb30
          path: .core-source
          persist-credentials: false
      - name: Install matching wasm-bindgen CLI
        if: steps.core-runtime-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Prepare verified Core Wasm runtime
        if: steps.core-runtime-cache.outputs.cache-hit != 'true'
        run: |
          ./scripts/prepare_core_wasm_runtime.sh .core-source
          rm -rf .core-source
      - name: Verify pinned Core Wasm runtime
        run: |
          set -Eeuo pipefail
          expected_core=c224304947280169017e298237bcf5361d1bfb30
          expected_wasm=173c3e9164c030384865013df87d36a29846b09cd2b8ee59b433509b2d77c90d
          for host in site telegram-mini-app discord-activity; do
            runtime="apps/$host/public/core/0.1.0"
            test -f "$runtime/index.js"
            test -f "$runtime/index_bg.wasm"
            test -f "$runtime/provenance.json"
            printf '%s  %s\n' "$expected_wasm" "$runtime/index_bg.wasm" | sha256sum --check --status
            jq -e --arg core "$expected_core" --arg digest "$expected_wasm" '
              .core_repository == "nilx-one/core"
              and .core_revision == $core
              and .contract_version == "0.1.0"
              and .wasm_sha256 == $digest
            ' "$runtime/provenance.json" >/dev/null
          done
      - name: Build every Web host
        run: pnpm build
      - name: Verify Core runtime in every host artifact
        run: |
          expected=173c3e9164c030384865013df87d36a29846b09cd2b8ee59b433509b2d77c90d
          for host in site telegram-mini-app discord-activity; do
            runtime="apps/$host/dist/core/0.1.0/index_bg.wasm"
            test -f "$runtime"
            printf '%s  %s\n' "$expected" "$runtime" | sha256sum --check --status
          done
      - name: Validate deploy target contract
        run: |
          set -Eeuo pipefail
          identity_contract="$(tr -d '[:space:]' < services/identity/deploy/contract.version)"
          [[ "$identity_contract" =~ ^[0-9]+$ ]]
          jq -e --argjson identity "$identity_contract" '
            .schema == 1
            and (.deployOrder == ["web", "telegram", "discord"])
            and ([.deployOrder[] as $name | .targets[$name]] | all(. != null))
            and ([.targets[] | .requiresIdentityContract <= $identity] | all)
            and ([.targets[] | (.publicPath | startswith("/"))] | all)
            and (.targets.web.app == "site")
            and (.targets.telegram.app == "telegram-mini-app")
            and (.targets.discord.app == "discord-activity")
          ' deploy/web/targets.json >/dev/null
      - name: Preserve verified host builds for deploy validation
        uses: actions/upload-artifact@v4
        with:
          name: web-host-dist-${{ github.sha }}
          path: |
            apps/site/dist
            apps/telegram-mini-app/dist
            apps/discord-activity/dist
          retention-days: 1

      - name: Preserve verified avatar assets
        uses: actions/upload-artifact@v4
        with:
          name: avatar-assets-${{ github.sha }}
          path: deploy/web/avatars
          retention-days: 1

  deploy-validation:
    name: Validate client deploy package
    if: github.event_name == 'pull_request'
    needs: full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate client deployment scripts
        run: |
          sh -n \
            deploy/web/deploy.sh \
            deploy/web/bootstrap-basemap.sh \
            deploy/web/check-public.sh \
            deploy/web/check-public.test.sh \
            deploy/web/check-map-public.sh \
            deploy/web/check-map-public.test.sh
          sh deploy/web/check-public.test.sh
          sh deploy/web/check-map-public.test.sh
      - name: Reuse verified Web host builds
        uses: actions/download-artifact@v4
        with:
          name: web-host-dist-${{ github.sha }}
          path: .
      - name: Restore artifact paths
        run: |
          set -Eeuo pipefail
          test -d site/dist
          test -d telegram-mini-app/dist
          test -d discord-activity/dist
          mkdir -p apps/site apps/telegram-mini-app apps/discord-activity
          mv site/dist apps/site/dist
          mv telegram-mini-app/dist apps/telegram-mini-app/dist
          mv discord-activity/dist apps/discord-activity/dist
      - name: Reuse verified avatar assets
        uses: actions/download-artifact@v4
        with:
          name: avatar-assets-${{ github.sha }}
          path: deploy/web/avatars
      - name: Validate immutable multi-host runtime image
        run: docker build --file deploy/web/Dockerfile --tag 0x1-clients:ci .
      - name: Verify every host runtime
        run: |
          set -Eeuo pipefail
          port=18080
          while IFS=$'\t' read -r target root; do
            container_id="$(docker run --detach --env "CLIENT_ROOT=$root" --publish "$port:8080" 0x1-clients:ci)"
            trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' RETURN
            ready=false
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error "http://127.0.0.1:$port/health" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            test "$ready" = true
            curl --fail --silent --show-error "http://127.0.0.1:$port/" >/dev/null
            docker exec "$container_id" test -f "$root/index.html"
            docker rm --force "$container_id" >/dev/null
            trap - RETURN
            port=$((port + 1))
          done < <(jq -r '.deployOrder[] as $name | [$name, .targets[$name].root] | @tsv' deploy/web/targets.json)
      - name: Validate generic client Compose contract
        run: |
          set -Eeuo pipefail
          COMPOSE_PROJECT_NAME=nilx-one-web \
          CLIENT_NAME=web \
          CLIENT_IMAGE=ghcr.io/nilx-one/0x1-web:sha-${GITHUB_SHA} \
          CLIENT_ROOT=/srv/site \
          EDGE_ALIAS=ox1-web \
          COMPAT_EDGE_ALIAS=ox1-telegram-mini-app \
          MAP_BASEMAP_PATH=/tmp/0x1-basemap.pmtiles \
          RELEASE_SHA="${GITHUB_SHA}" \
            docker compose --file deploy/web/compose.yaml config --quiet
