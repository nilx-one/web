name: Web

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository policy
        run: pnpm policy
      - name: Verify formatting
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test contracts and integration
        run: pnpm test
      - name: Build every Web host
        run: pnpm build
      - name: Preserve Telegram build for deploy validation
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mini-app-dist-${{ github.sha }}
          path: apps/telegram-mini-app/dist
          retention-days: 1

  deploy-validation:
    name: Validate Telegram deploy package
    if: github.event_name == 'pull_request'
    needs: full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse verified Telegram build
        uses: actions/download-artifact@v4
        with:
          name: telegram-mini-app-dist-${{ github.sha }}
          path: apps/telegram-mini-app/dist
      - name: Validate runtime image
        run: docker build --file deploy/telegram-mini-app/Dockerfile --tag 0x1-telegram-mini-app:ci .
      - name: Validate runtime Compose contract
        env:
          TELEGRAM_MINI_APP_IMAGE: ghcr.io/nilx-one/0x1-telegram-mini-app:sha-${{ github.sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: docker compose --file deploy/telegram-mini-app/compose.yaml config --quiet
