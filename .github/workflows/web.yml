name: Web

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify repository policy
        run: pnpm policy
      - name: Verify formatting
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test contracts and integration
        run: pnpm test
      - name: Checkout pinned Core runtime source
        uses: actions/checkout@v4
        with:
          repository: nilx-one/core
          ref: e09a42184951b6f40ad4b11eedf6e48c5b6a0ac9
          path: .core-source
          persist-credentials: false
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Prepare verified Core Wasm runtime
        run: |
          ./scripts/prepare_core_wasm_runtime.sh .core-source
          rm -rf .core-source
      - name: Build every Web host
        run: pnpm build
      - name: Verify Core runtime in every host artifact
        run: |
          expected=d55bd185a9ec108cf83c0394c350c094cae9c09e381a1c22b11e388b1cd93320
          for host in site telegram-mini-app; do
            runtime="apps/$host/dist/core/0.1.0/index_bg.wasm"
            test -f "$runtime"
            printf '%s  %s\n' "$expected" "$runtime" | sha256sum --check --status
          done
      - name: Preserve canonical Web build for deploy validation
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/site/dist
          retention-days: 1

  deploy-validation:
    name: Validate Web deploy package
    if: github.event_name == 'pull_request'
    needs: full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reuse verified Web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: apps/site/dist
      - name: Validate runtime image
        run: docker build --file deploy/web/Dockerfile --tag 0x1-web:ci .
      - name: Validate runtime Compose contract
        env:
          WEB_IMAGE: ghcr.io/nilx-one/0x1-web:sha-${{ github.sha }}
          RELEASE_SHA: ${{ github.sha }}
        run: docker compose --file deploy/web/compose.yaml config --quiet
