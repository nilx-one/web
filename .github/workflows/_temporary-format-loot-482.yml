name: Temporary Prettier capture 482
on:
  push:
    branches:
      - feature/xping-loot-visual-feedback
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture canonical formatter result
        run: |
          pnpm exec prettier --write packages/map-contract/src/index.ts packages/map-maplibre/src/avatar-layer.ts packages/product-app/src/features/flyover/flight-loot.test.ts packages/product-app/src/features/flyover/flight-loot.ts packages/product-app/src/features/flyover/use-flyover.ts
          python3 - <<'PY'
          import pathlib, json
          files = ["packages/map-contract/src/index.ts","packages/map-maplibre/src/avatar-layer.ts","packages/product-app/src/features/flyover/flight-loot.test.ts","packages/product-app/src/features/flyover/flight-loot.ts","packages/product-app/src/features/flyover/use-flyover.ts"]
          for path in files:
              encoded = json.dumps(pathlib.Path(path).read_text(), ensure_ascii=True)
              print('FORMAT_FILE '+path)
              for start in range(0, len(encoded), 800):
                  print('FORMAT_CHUNK '+encoded[start:start+800])
              print('FORMAT_END')
          PY
