name: Refresh map lockfile

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feature/maplibre-renderer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh lockfile only
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile when changed
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "chore(map): refresh pnpm lockfile"
          git push origin HEAD:${{ github.head_ref }}
