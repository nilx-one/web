name: Error Trash Service CI

on:
  pull_request:
    paths:
      - "services/errors/**"
      - ".github/workflows/error-trash-service.yml"
  push:
    branches:
      - master
    paths:
      - "services/errors/**"
      - ".github/workflows/error-trash-service.yml"

permissions:
  contents: read

jobs:
  full-ci:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Resolve locked dependencies
        run: cargo generate-lockfile --manifest-path services/errors/Cargo.toml
      - name: Check formatting
        run: cargo fmt --manifest-path services/errors/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path services/errors/Cargo.toml --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path services/errors/Cargo.toml --locked --all-features

  deploy-validation:
    name: Validate error trash runtime package
    needs: full-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate contract version
        run: |
          set -Eeuo pipefail
          error_trash_contract="$(tr -d '[:space:]' < services/errors/deploy/contract.version)"
          [[ "$error_trash_contract" =~ ^[0-9]+$ ]]
      - name: Build runtime image
        run: docker build --file services/errors/Dockerfile --tag aiaiaiai-errors:ci .
      - name: Validate runtime Compose contract
        run: |
          set -Eeuo pipefail
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          printf '%s\n' 'ERROR_TRASH_INGEST_TOKENS=nilx-one/web:ci-only-ingest-token-that-is-long-enough' >"$env_file"
          error_trash_contract="$(tr -d '[:space:]' < services/errors/deploy/contract.version)"
          ERROR_TRASH_IMAGE=aiaiaiai-errors:ci \
          ERROR_TRASH_ENV_FILE="$env_file" \
          ERROR_TRASH_DATABASE_URL='postgresql://postgres:postgres@database:5432/postgres' \
          ERROR_TRASH_CONTRACT="$error_trash_contract" \
          RELEASE_SHA="${GITHUB_SHA}" \
            docker compose --file services/errors/deploy/compose.yaml config --quiet
      - name: Verify ingest and read boundaries on PostgreSQL
        run: |
          set -Eeuo pipefail
          docker network create error-trash-ci >/dev/null
          docker run --detach --name error-trash-postgres \
            --network error-trash-ci \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_DB=error_trash \
            postgres:17-bookworm >/dev/null
          docker run --detach --name error-trash-ci \
            --network error-trash-ci \
            --publish 127.0.0.1:8099:8080 \
            --env DATABASE_URL='postgresql://postgres:postgres@error-trash-postgres:5432/error_trash' \
            --env ERROR_TRASH_INGEST_TOKENS='nilx-one/web:ci-only-ingest-token-that-is-long-enough' \
            --env ERROR_TRASH_READ_TOKEN='ci-only-read-token-that-is-long-enough-too' \
            aiaiaiai-errors:ci >/dev/null
          trap 'docker rm --force error-trash-ci error-trash-postgres >/dev/null 2>&1 || true; docker network rm error-trash-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8099/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8099/health >/dev/null
          [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8099/api/v1/errors \
            --header 'content-type: application/json' \
            --data '{"type":"ci","full_text":"unauthenticated dump"}')" = 401 ]
          [ "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:8099/api/v1/errors \
            --header 'authorization: Bearer ci-only-ingest-token-that-is-long-enough' \
            --header 'content-type: application/json' \
            --data '{"type":"ci","full_text":"packaged runtime dump"}')" = 201 ]
          curl --fail --silent http://127.0.0.1:8099/api/v1/errors \
            --header 'authorization: Bearer ci-only-read-token-that-is-long-enough-too' \
            | grep -Fq 'packaged runtime dump'
