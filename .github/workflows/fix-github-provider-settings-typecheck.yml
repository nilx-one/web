name: Fix GitHub provider settings typecheck

on:
  push:
    branches:
      - feature/github-provider-settings
    paths:
      - .github/workflows/fix-github-provider-settings-typecheck.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/github-provider-settings
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Narrow provider before domain guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/identity-http/src/index.ts')
          text = path.read_text()
          old = '''      body.state === "disconnected" &&\n      isBondProviderType(body.provider)\n'''
          new = '''      body.state === "disconnected" &&\n      typeof body.provider === "string" &&\n      isBondProviderType(body.provider)\n'''
          if text.count(old) != 1:
              raise SystemExit('expected one disconnect provider guard')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write packages/identity-http/src/index.ts
          pnpm typecheck
      - name: Remove workflow and commit fix
        run: |
          rm .github/workflows/fix-github-provider-settings-typecheck.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: narrow disconnected provider response"
          git push origin HEAD:feature/github-provider-settings
