name: Package fresh 0x1 Identity secret envelope

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-nilx-fresh-identity-secrets
  cancel-in-progress: false

jobs:
  envelope:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/nilx-one/0x1-identity-fresh-secrets
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify product-owned secret and host's public encryption recipient
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RECIPIENT: ${{ vars.EDGE_DEV_1_IDENTITY_AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail
          test -n "$TELEGRAM_BOT_TOKEN" || { echo 'Missing 0x1 product TELEOXIDE token' >&2; exit 1; }
          [[ "$TELEGRAM_BOT_TOKEN" =~ ^[0-9]{6,12}:[A-Za-z0-9_-]{30,}$ ]] || {
            echo 'Malformed 0x1 product TELEGRAM_BOT_TOKEN' >&2; exit 1;
          }
          [[ "$RECIPIENT" =~ ^age1[ac-hj-np-z02-9]{50,70}$ ]] || {
            echo 'Missing or invalid public recipient from edge-dev-1' >&2; exit 1;
          }

      - name: Install age encryption tool
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes -qq age
          command -v age >/dev/null

      - name: Seal only the Telegram credential for the recipient on edge-dev-1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RECIPIENT: ${{ vars.EDGE_DEV_1_IDENTITY_AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail
          umask 077
          dir="$RUNNER_TEMP/fresh-identity-envelope"
          install -d -m 0700 "$dir"
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN" | \
            age --recipient "$RECIPIENT" --output "$dir/secrets.age"
          test -s "$dir/secrets.age"
          printf 'FROM scratch\nCOPY secrets.age /secrets.age\n' > "$dir/Dockerfile"
          echo "ENVELOPE_CONTEXT=$dir" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to product GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish encrypted envelope image (no raw token)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.ENVELOPE_CONTEXT }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Sign envelope provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Print immutable reference for Infra workflow
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "Encrypted envelope: \`ghcr.io/nilx-one/0x1-identity-fresh-secrets@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The plaintext token remains owned by nilx-one/web, never by Infra." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transient envelope
        if: always()
        run: rm -rf "$RUNNER_TEMP/fresh-identity-envelope"
