# Retired: the legacy fresh bootstrap shipped the Bot API credential into Web.
# The normal reviewed Identity envelope carries public metadata and the other
# provider credentials. Keep this entrypoint fail-closed for old bookmarks.
name: Package fresh 0x1 Identity secret envelope

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse retired fresh token package
        run: |
          echo "::error::Retired token-bearing Identity bootstrap. Use the reviewed Package Identity Service workflow and Infra contract 20."
          exit 1
