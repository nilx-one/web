name: temporary-format-feature

on:
  push:
    branches:
      - fix/telegram-existing-bond-auth-link

permissions:
  contents: write

jobs:
  format:
    if: "!startsWith(github.event.head_commit.message, 'chore(format):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write packages/product-app/src/index.tsx
      - run: |
          if git diff --quiet -- packages/product-app/src/index.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/product-app/src/index.tsx
          git commit -m "chore(format): format product app"
          git push origin HEAD:${{ github.ref_name }}
