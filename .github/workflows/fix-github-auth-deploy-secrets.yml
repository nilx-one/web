name: Apply GitHub auth deploy secret fix

on:
  push:
    branches:
      - fix/github-auth-deploy-secrets

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/github-auth-deploy-secrets
      - name: Patch deploy credential preservation
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/deploy-identity-service.yml')
          text = workflow.read_text()
          text = text.replace(
              '      DISCORD_CLIENT_SECRET:\n        required: false\n',
              '      DISCORD_CLIENT_SECRET:\n        required: false\n      GITHUB_AUTH_CLIENT_SECRET:\n        required: false\n',
          )
          text = text.replace(
              '      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}\n      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}\n',
              '      DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}\n      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}\n      GITHUB_AUTH_CLIENT_ID: ${{ vars.GITHUB_AUTH_CLIENT_ID }}\n      GITHUB_AUTH_CLIENT_SECRET: ${{ secrets.GITHUB_AUTH_CLIENT_SECRET }}\n',
          )
          text = text.replace(
              '          if [ -n "$DISCORD_CLIENT_ID" ] || [ -n "$DISCORD_CLIENT_SECRET" ]; then\n            test -n "$DISCORD_CLIENT_ID"\n            test -n "$DISCORD_CLIENT_SECRET"\n          fi\n',
              '          if [ -n "$DISCORD_CLIENT_ID" ] || [ -n "$DISCORD_CLIENT_SECRET" ]; then\n            test -n "$DISCORD_CLIENT_ID"\n            test -n "$DISCORD_CLIENT_SECRET"\n          fi\n          if [ -n "$GITHUB_AUTH_CLIENT_ID" ] || [ -n "$GITHUB_AUTH_CLIENT_SECRET" ]; then\n            test -n "$GITHUB_AUTH_CLIENT_ID"\n            test -n "$GITHUB_AUTH_CLIENT_SECRET"\n          fi\n',
          )
          text = text.replace(
              '          if [ -n "$DISCORD_CLIENT_ID" ] && [ -n "$DISCORD_CLIENT_SECRET" ]; then\n            printf \'DISCORD_CLIENT_ID=%s\\n\' "$DISCORD_CLIENT_ID" >>"$provider_file"\n            printf \'DISCORD_CLIENT_SECRET=%s\\n\' "$DISCORD_CLIENT_SECRET" >>"$provider_file"\n          fi\n',
              '          if [ -n "$DISCORD_CLIENT_ID" ] && [ -n "$DISCORD_CLIENT_SECRET" ]; then\n            printf \'DISCORD_CLIENT_ID=%s\\n\' "$DISCORD_CLIENT_ID" >>"$provider_file"\n            printf \'DISCORD_CLIENT_SECRET=%s\\n\' "$DISCORD_CLIENT_SECRET" >>"$provider_file"\n          fi\n          if [ -n "$GITHUB_AUTH_CLIENT_ID" ] && [ -n "$GITHUB_AUTH_CLIENT_SECRET" ]; then\n            printf \'GITHUB_AUTH_CLIENT_ID=%s\\n\' "$GITHUB_AUTH_CLIENT_ID" >>"$provider_file"\n            printf \'GITHUB_AUTH_CLIENT_SECRET=%s\\n\' "$GITHUB_AUTH_CLIENT_SECRET" >>"$provider_file"\n          fi\n',
          )
          workflow.write_text(text)

          prepare = Path('services/identity/deploy/prepare-runtime-env.sh')
          text = prepare.read_text()
          text = text.replace(
              'github_auth_client_id="$(read_provider_value GITHUB_AUTH_CLIENT_ID)"\ngithub_auth_client_secret="$(read_provider_value GITHUB_AUTH_CLIENT_SECRET)"\nvalidate_pair "GitHub browser OAuth" "$github_auth_client_id" "$github_auth_client_secret"\n',
              'github_auth_client_id="$(read_provider_value GITHUB_AUTH_CLIENT_ID)"\ngithub_auth_client_secret="$(read_provider_value GITHUB_AUTH_CLIENT_SECRET)"\ngithub_auth_from_provider=false\nif [ -n "$github_auth_client_id" ] || [ -n "$github_auth_client_secret" ]; then\n  github_auth_from_provider=true\nelse\n  github_auth_client_id="$(read_existing_value GITHUB_AUTH_CLIENT_ID)"\n  github_auth_client_secret="$(read_existing_value GITHUB_AUTH_CLIENT_SECRET)"\nfi\nvalidate_pair "GitHub browser OAuth" "$github_auth_client_id" "$github_auth_client_secret"\n',
          )
          text = text.replace(
              '  if [ "$telegram_oidc_from_provider" = false ] && [ -n "$telegram_oidc_client_id" ]; then\n    printf \'TELEGRAM_OIDC_CLIENT_ID=%s\\n\' "$telegram_oidc_client_id"\n    printf \'TELEGRAM_OIDC_CLIENT_SECRET=%s\\n\' "$telegram_oidc_client_secret"\n  fi\n  cat "$provider_env"\n',
              '  if [ "$telegram_oidc_from_provider" = false ] && [ -n "$telegram_oidc_client_id" ]; then\n    printf \'TELEGRAM_OIDC_CLIENT_ID=%s\\n\' "$telegram_oidc_client_id"\n    printf \'TELEGRAM_OIDC_CLIENT_SECRET=%s\\n\' "$telegram_oidc_client_secret"\n  fi\n  if [ "$github_auth_from_provider" = false ] && [ -n "$github_auth_client_id" ]; then\n    printf \'GITHUB_AUTH_CLIENT_ID=%s\\n\' "$github_auth_client_id"\n    printf \'GITHUB_AUTH_CLIENT_SECRET=%s\\n\' "$github_auth_client_secret"\n  fi\n  cat "$provider_env"\n',
          )
          prepare.write_text(text)

          tests = Path('services/identity/deploy/prepare-runtime-env.test.sh')
          text = tests.read_text()
          text = text.replace(
              "  printf '%s\\n' 'DISCORD_CLIENT_SECRET=discord-secret'\n} >\"$provider\"\n",
              "  printf '%s\\n' 'DISCORD_CLIENT_SECRET=discord-secret'\n  printf '%s\\n' 'GITHUB_AUTH_CLIENT_ID=github-auth-client'\n  printf '%s\\n' 'GITHUB_AUTH_CLIENT_SECRET=github-auth-secret'\n} >\"$provider\"\n",
              1,
          )
          text = text.replace(
              '[ "$(value_of DISCORD_CLIENT_SECRET "$runtime")" = discord-secret ]\n',
              '[ "$(value_of DISCORD_CLIENT_SECRET "$runtime")" = discord-secret ]\n[ "$(value_of GITHUB_AUTH_CLIENT_ID "$runtime")" = github-auth-client ]\n[ "$(value_of GITHUB_AUTH_CLIENT_SECRET "$runtime")" = github-auth-secret ]\n',
              1,
          )
          text = text.replace(
              '[ "$(value_of TELEGRAM_OIDC_CLIENT_SECRET "$runtime")" = telegram-secret ]\n\n{\n  printf \'%s\\n\' \'TELOXIDE_TOKEN=missing-pair\'\n',
              '[ "$(value_of TELEGRAM_OIDC_CLIENT_SECRET "$runtime")" = telegram-secret ]\n[ "$(value_of GITHUB_AUTH_CLIENT_ID "$runtime")" = github-auth-client ]\n[ "$(value_of GITHUB_AUTH_CLIENT_SECRET "$runtime")" = github-auth-secret ]\n\n{\n  printf \'%s\\n\' \'TELOXIDE_TOKEN=github-missing-pair\'\n  printf \'%s\\n\' \'GITHUB_AUTH_CLIENT_ID=github-auth-client\'\n} >"$provider"\nif sh "$prepare" "$runtime" "$provider" >/dev/null 2>&1; then\n  echo "incomplete GitHub browser OAuth credentials unexpectedly succeeded" >&2\n  exit 1\nfi\n\n{\n  printf \'%s\\n\' \'TELOXIDE_TOKEN=missing-pair\'\n',
          )
          tests.write_text(text)
          PY
          sh services/identity/deploy/prepare-runtime-env.test.sh
          git diff --check
      - name: Remove helper workflow and commit
        run: |
          rm .github/workflows/fix-github-auth-deploy-secrets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-identity-service.yml services/identity/deploy/prepare-runtime-env.sh services/identity/deploy/prepare-runtime-env.test.sh .github/workflows/fix-github-auth-deploy-secrets.yml
          git commit -m 'fix: preserve GitHub auth deploy credentials'
          git push origin HEAD:fix/github-auth-deploy-secrets
