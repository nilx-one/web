name: Pin PR 92 Core runtime

on:
  push:
    branches:
      - claude/subdomain-registration-xjk8jc

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/subdomain-registration-xjk8jc
      - uses: actions/checkout@v4
        with:
          repository: nilx-one/core
          ref: c224304947280169017e298237bcf5361d1bfb30
          path: .core-source
          persist-credentials: false
      - name: Pin Core dependency graph
        run: |
          set -Eeuo pipefail
          (
            cd .core-source
            cargo generate-lockfile
            cargo update -p tinyvec --precise 1.12.0
          )
          cp .core-source/Cargo.lock scripts/core-runtime.Cargo.lock
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build pinned Core runtime and synchronize verification
        run: |
          set -Eeuo pipefail
          rm -rf .core-wasm-runtime
          (
            cd .core-source
            ./scripts/build_wasm_package.sh "$GITHUB_WORKSPACE/.core-wasm-runtime"
          )
          actual="$(sha256sum .core-wasm-runtime/index_bg.wasm | awk '{print $1}')"
          printf 'Pinned Core Wasm SHA-256: %s\n' "$actual"
          python - "$actual" <<'PY'
          from pathlib import Path
          import re
          import sys

          digest = sys.argv[1]

          prepare = Path("scripts/prepare_core_wasm_runtime.sh")
          text = prepare.read_text()
          text, count = re.subn(
              r'expected_wasm_sha256="[0-9a-f]{64}"',
              f'expected_wasm_sha256="{digest}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("prepare script digest pin drifted")
          marker = 'runtime_build="$PWD/.core-wasm-runtime"\n'
          if 'runtime_lock="$PWD/scripts/core-runtime.Cargo.lock"' not in text:
              if marker not in text:
                  raise SystemExit("prepare script runtime build marker drifted")
              text = text.replace(
                  marker,
                  marker + 'runtime_lock="$PWD/scripts/core-runtime.Cargo.lock"\n',
                  1,
              )
          old = '''  cd "$core_dir"\n  cargo generate-lockfile\n  # Keep the pinned Core revision reproducible even when a newer compatible\n  # tinyvec release appears on crates.io. tinyvec 1.13.0 currently fails the\n  # wasm/no_std build used by this runtime boundary.\n  cargo update -p tinyvec --precise 1.12.0\n  ./scripts/build_wasm_package.sh "$runtime_build"\n'''
          new = '''  cd "$core_dir"\n  # Core is consumed here as a runtime artifact, not as an unconstrained library\n  # build. Its dependency graph is locked next to the Web pin so the verified\n  # Wasm digest cannot drift when crates.io publishes a compatible release.\n  cp "$runtime_lock" Cargo.lock\n  ./scripts/build_wasm_package.sh "$runtime_build"\n'''
          if old not in text:
              raise SystemExit("prepare script dependency block drifted")
          prepare.write_text(text.replace(old, new, 1))

          workflow = Path(".github/workflows/web.yml")
          text = workflow.read_text()
          text, count = re.subn(
              r'expected=[0-9a-f]{64}',
              f'expected={digest}',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Web workflow digest pin drifted")
          workflow.write_text(text)
          PY
      - name: Commit reproducible runtime pin
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/core-runtime.Cargo.lock scripts/prepare_core_wasm_runtime.sh .github/workflows/web.yml
          git commit -m "ci: lock the pinned Core Wasm dependency graph"
          git push origin HEAD:claude/subdomain-registration-xjk8jc
