name: Fix issue 150 type narrowing

on:
  push:
    branches:
      - fix/150-pub-dress-slug-only

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve authenticated Avaia address across async boundary
        shell: python
        run: |
          from pathlib import Path

          path = Path("packages/product-app/src/index.tsx")
          text = path.read_text()
          before = '''    const deviceAvaiaAvailability = avaiaAvailability({
              acceleratedGraphics: "gpu" in navigator,
            });
            return (
'''
          after = '''    const deviceAvaiaAvailability = avaiaAvailability({
              acceleratedGraphics: "gpu" in navigator,
            });
            const ownedAvaiaPubDress = viewModel.identity.avaiaPubDress;
            return (
'''
          if before not in text:
            raise SystemExit("authenticated block marker not found")
          text = text.replace(before, after, 1)
          fallback = ''': viewModel.identity.avaiaPubDress;'''
          if fallback not in text:
            raise SystemExit("Avaia fallback marker not found")
          text = text.replace(fallback, ''': ownedAvaiaPubDress;''', 1)
          path.write_text(text)
      - name: Commit correction and remove helper workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/fix-150-typecheck.yml
          git add packages/product-app/src/index.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve authenticated Avaia address for save"
          git push origin HEAD:fix/150-pub-dress-slug-only
