name: Fix PR 92 tests

on:
  push:
    branches:
      - claude/subdomain-registration-xjk8jc

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/subdomain-registration-xjk8jc
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align product test fixtures with Core-owned label results
        run: |
          python - <<'PY'
          from pathlib import Path

          field = Path("packages/product-app/src/features/identity/pub-dress-url-field.test.tsx")
          text = field.read_text()
          text = text.replace(
              '    resolution: undefined,\n    ...overrides,',
              '    resolution: undefined,\n    derivation: { kind: "label", label: "0xda-sha" },\n    ...overrides,',
              1,
          )
          text = text.replace(
              'expect(screen.getByText(/Lowercased for the address/)).toBeInTheDocument();',
              'expect(screen.getByText(/Core maps this ASCII address/)).toBeInTheDocument();',
              1,
          )
          text = text.replace(
              'renderField({ resolution: taken, suffix: "7412" });',
              'renderField({\n      resolution: taken,\n      suffix: "7412",\n      composition: { kind: "label", label: "0xda-sha7412" },\n    });',
              1,
          )
          text = text.replace(
              'renderField({ resolution: taken, suffix: "7-" });',
              'renderField({\n      resolution: taken,\n      suffix: "7-",\n      composition: { kind: "error", code: "invalid_character" },\n    });',
              1,
          )
          text = text.replace(
              'renderField({ selection: { discriminator: "0", slug: "небо" } });',
              'renderField({\n      selection: { discriminator: "0", slug: "небо" },\n      derivation: { kind: "label", label: "xn--0x0-dddt1cj" },\n    });',
              1,
          )
          text = text.replace(
              'renderField({ selection: { discriminator: "0", slug: "אבג" } });',
              'renderField({\n      selection: { discriminator: "0", slug: "אבג" },\n      derivation: { kind: "error", code: "bidi_rule" },\n    });',
              1,
          )
          field.write_text(text)

          foundation = Path("packages/product-app/src/features/identity/identity-foundation-view.test.tsx")
          text = foundation.read_text()
          needle = '''        password=""\n        selection={selection}\n        {...(pubDressUrlResolution ? { pubDressUrlResolution } : {})}'''
          replacement = '''        password=""\n        selection={selection}\n        pubDressLabelDerivation={{ kind: "label", label: "0xda-sha" }}\n        {...(pubDressUrlResolution ? { pubDressUrlResolution } : {})}'''
          if needle not in text:
              raise SystemExit("identity form fixture drifted")
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              'expect(screen.getByText(/Lowercased for the address/)).toBeInTheDocument();',
              'expect(screen.getByText(/Core maps this ASCII address/)).toBeInTheDocument();',
              1,
          )
          foundation.write_text(text)

          vm = Path("packages/product-app/src/features/identity/pub-dress-url-view-model.ts")
          text = vm.read_text()
          old = '      return "No address — this value fails the Core bidirectional-text rule";'
          new = '      return "No address — a right-to-left script cannot follow the 0x prefix";'
          if old not in text:
              raise SystemExit("bidi copy drifted")
          vm.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm exec prettier --write packages/product-app/src/features/identity/pub-dress-url-field.test.tsx packages/product-app/src/features/identity/identity-foundation-view.test.tsx packages/product-app/src/features/identity/pub-dress-url-view-model.ts
      - run: pnpm exec vitest run packages/product-app/src/features/identity/identity-foundation-view.test.tsx packages/product-app/src/features/identity/pub-dress-url-field.test.tsx packages/product-app/src/features/identity/pub-dress-url-view-model.test.ts
      - name: Commit fixture alignment
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/product-app/src/features/identity/pub-dress-url-field.test.tsx packages/product-app/src/features/identity/identity-foundation-view.test.tsx packages/product-app/src/features/identity/pub-dress-url-view-model.ts
          git commit -m "test(identity): supply Core label results to address fixtures"
          git push origin HEAD:claude/subdomain-registration-xjk8jc
