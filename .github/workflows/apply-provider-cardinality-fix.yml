name: Apply provider cardinality migration fix

on:
  push:
    branches:
      - fix/provider-cardinality-migration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/provider-cardinality-migration
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply migration wiring and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          repository = Path('services/identity/src/repository.rs')
          text = repository.read_text()
          needle = '''        if !schema.contains("'github'") {
            sqlx::raw_sql(include_str!("../migrations/0010_github_provider.sql"))
                .execute(&mut *transaction)
                .await?;
        }
        transaction.commit().await?;
'''
          replacement = '''        if !schema.contains("'github'") {
            sqlx::raw_sql(include_str!("../migrations/0010_github_provider.sql"))
                .execute(&mut *transaction)
                .await?;
        }
        sqlx::raw_sql(include_str!("../migrations/0011_provider_type_cardinality.sql"))
            .execute(&mut *transaction)
            .await?;
        transaction.commit().await?;
'''
          assert needle in text
          repository.write_text(text.replace(needle, replacement, 1))

          provider_link = Path('services/identity/src/provider_link.rs')
          text = provider_link.read_text()
          marker = '''    #[tokio::test]
    async fn provider_binding_cannot_be_moved_between_bonds() {
'''
          test = '''    #[tokio::test]
    async fn initialized_database_enforces_provider_type_cardinality_directly() {
        let directory = tempfile::tempdir().expect("temporary directory");
        let database = directory.path().join("identity.sqlite");
        let database_url = format!("sqlite://{}", database.display());
        let identities = IdentityRepository::connect(&database_url)
            .await
            .expect("identity repository");
        let links = ProviderLinkRepository::connect(&database_url)
            .await
            .expect("provider link repository");
        let bond = register_bond(&identities, "0x0sky", "db-boundary").await;

        links
            .link(&bond, &ProviderIdentity::github(1))
            .await
            .expect("first GitHub link");
        let duplicate = sqlx::query(
            "INSERT INTO identity_providers (provider, provider_subject, pub_dress) VALUES ('github', '2', ?)",
        )
        .bind(bond.as_str())
        .execute(&links.pool)
        .await;
        assert!(duplicate.is_err(), "database must reject a second GitHub account for one Bond");
    }

'''
          assert marker in text
          provider_link.write_text(text.replace(marker, test + marker, 1))
          PY
          cargo fmt --manifest-path services/identity/Cargo.toml --all
          cargo test --manifest-path services/identity/Cargo.toml provider_link
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/identity/src/repository.rs services/identity/src/provider_link.rs
          git commit -m 'fix: apply provider cardinality migration on startup'
          git push origin HEAD:fix/provider-cardinality-migration
