name: Format public Bond URL slice

on:
  push:
    branches:
      - feature/project-public-bond-url

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/project-public-bond-url
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format identity sources and remove this one-shot workflow
        run: |
          set -Eeuo pipefail
          cargo fmt --manifest-path services/identity/Cargo.toml --all
          rm .github/workflows/format-public-bond-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/identity/src/api.rs services/identity/src/repository.rs .github/workflows/format-public-bond-url.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(identity): apply rustfmt"
          git push origin HEAD:feature/project-public-bond-url
