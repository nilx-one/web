name: Validate Deploy Contract

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/deploy-identity-service.yml"
      - ".github/workflows/deploy-web.yml"
      - "deploy/web/**"
      - "services/identity/deploy/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/deploy-production.yml"
      - ".github/workflows/deploy-identity-service.yml"
      - ".github/workflows/deploy-web.yml"
      - "deploy/web/**"
      - "services/identity/deploy/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate identity contract and targets
        shell: bash
        run: |
          set -Eeuo pipefail

          identity_contract="$(tr -d '[:space:]' < services/identity/deploy/contract.version)"
          [[ "$identity_contract" =~ ^[0-9]+$ ]] || {
            echo "::error file=services/identity/deploy/contract.version::identity contract must be an integer"
            exit 1
          }

          jq -e '
            (.deployOrder | type == "array" and length > 0) and
            (.targets | type == "object") and
            all(.deployOrder[]; (.targets[.] != null)) and
            all(.deployOrder[]; (.targets[.].requiresIdentityContract | type == "number"))
          ' deploy/web/targets.json >/dev/null

          jq -r '.deployOrder[]' deploy/web/targets.json |
          while IFS= read -r target; do
            required="$(jq -r --arg target "$target" '.targets[$target].requiresIdentityContract' deploy/web/targets.json)"

            if (( required > identity_contract )); then
              echo "::error file=deploy/web/targets.json::target '$target' requires identity contract $required, repository provides $identity_contract"
              exit 1
            fi

            case "$target" in
              web|telegram|discord) ;;
              *)
                echo "::error file=deploy/web/targets.json::unsupported client target '$target'"
                exit 1
                ;;
            esac
          done

          echo "Identity contract: $identity_contract"
          jq '.deployOrder, .targets' deploy/web/targets.json

      - name: Validate production orchestrator
        shell: bash
        run: |
          set -Eeuo pipefail
          file=".github/workflows/deploy-production.yml"

          grep -Fq "name: Deploy Production" "$file"
          grep -Fq "run-name: Deploy Production — " "$file"

          for target in all web telegram discord identity; do
            grep -Fq -- "- $target" "$file"
          done

          grep -Fq "uses: ./.github/workflows/deploy-identity-service.yml" "$file"
          grep -Fq "secrets: inherit" "$file"
          grep -Fq "uses: ./.github/workflows/deploy-web.yml" "$file"

          if grep -Fq "NILXONE_IDENTITY_PROVIDER_ENV_B64" "$file"; then
            echo "::error file=$file::legacy provider env bundle must not be used"
            exit 1
          fi

      - name: Validate identity handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          file=".github/workflows/deploy-identity-service.yml"

          grep -Fq "workflow_call:" "$file"
          grep -Fq "release_sha:" "$file"
          grep -Fq "required_contract:" "$file"
          grep -Fq "force:" "$file"

          for secret in TELOXIDE_TOKEN TELEGRAM_OIDC_CLIENT_SECRET DISCORD_CLIENT_SECRET; do
            grep -Fq "$secret:" "$file"
          done

          grep -Fq "telegram_oidc_client_id:" "$file"
          grep -Fq "discord_client_id:" "$file"

          grep -Fq "TELOXIDE_TOKEN: " "$file"
          grep -Fq "TELEGRAM_OIDC_CLIENT_SECRET: " "$file"
          grep -Fq "DISCORD_CLIENT_SECRET: " "$file"

          if grep -Fq "NILXONE_IDENTITY_PROVIDER_ENV_B64" "$file"; then
            echo "::error file=$file::legacy provider env bundle must not be used"
            exit 1
          fi

      - name: Validate client handoff
        shell: bash
        run: |
          set -Eeuo pipefail
          file=".github/workflows/deploy-web.yml"

          grep -Fq "workflow_call:" "$file"
          grep -Fq "release_sha:" "$file"
          grep -Fq "INFRA_DEPLOY_TOKEN:" "$file"
          grep -Fq 'event_type: "deploy-workload"' "$file"
          grep -Fq "source_repository" "$file"
          grep -Fq "IMAGE_REPOSITORY: ghcr.io/nilx-one/0x1-web" "$file"
          grep -Fq 'sha-$RELEASE_SHA' "$file"

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Deploy contract"
            echo
            echo "- identity contract: $(tr -d '[:space:]' < services/identity/deploy/contract.version)"
            echo "- target contract: validated"
            echo "- production orchestrator: validated"
            echo "- identity handoff: validated"
            echo "- client handoff: validated"
            echo "- deployment: not performed"
          } >> "$GITHUB_STEP_SUMMARY"
