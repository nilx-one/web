<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>0xda-market</title>
  </head>
  <body>
    <main>
      <header>
        <h1 id="market-title">0xda-market</h1>
        <span id="snapshot"></span>
      </header>
      <p id="browse-notice" role="note"></p>
      <div class="filters">
        <input id="search" type="search" /><select id="category"></select>
      </div>
      <p id="status" role="status"></p>
      <button id="retry" type="button" hidden></button>
      <section id="products"></section>
      <nav class="navigation">
        <button id="previous" type="button">←</button
        ><button id="home" type="button">Categories</button
        ><button id="next" type="button">→</button>
      </nav>
      <footer><a href="/market-license.txt">WebApp · MIT License</a></footer>
    </main>
    <dialog id="checkout-dialog">
      <button id="close-dialog" type="button">×</button>
      <p id="dialog-category"></p>
      <h2 id="dialog-name"></h2>
      <p id="dialog-price"></p>
      <p class="browse-details"></p>
      <p id="dialog-status" hidden></p>
      <button id="checkout-action" type="button" hidden></button>
    </dialog>
    <script type="module" src="/src/market/main.ts"></script>
  </body>
</html>
