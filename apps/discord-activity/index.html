<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="The Discord-hosted 0x1 Web client." />
    <meta name="theme-color" content="#f3f8fc" />
    <script>
      /* The appearance is resolved before the first paint, so the sign-in
         surface opens in the colour the world will keep. Dark is only ever
         entered on evidence: a stored choice, or a device that asks for it. */
      (function () {
        var resolved = "light";
        try {
          var stored = window.localStorage.getItem(
            "nilx-one.interface.appearance",
          );
          resolved =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch (error) {
          resolved = "light";
        }
        document.documentElement.setAttribute("data-appearance", resolved);
        var chrome = document.querySelector('meta[name="theme-color"]');
        if (chrome) {
          chrome.setAttribute(
            "content",
            resolved === "dark" ? "#121116" : "#f3f8fc",
          );
        }
      })();
    </script>
    <title>0x1 · Discord</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
